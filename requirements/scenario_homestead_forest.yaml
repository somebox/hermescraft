id: scenario_homestead_forest
extends: profiles/homestead

gates:
  - biome in [forest, flower_forest, birch_forest, old_growth_birch_forest, dark_forest, taiga, snowy_taiga, old_growth_pine_taiga, old_growth_spruce_taiga, plains, sunflower_plains, meadow, jungle, sparse_jungle, bamboo_jungle, cherry_grove, savanna, savanna_plateau, swamp, mangrove_swamp, windswept_forest, grove] >= 50%
  - biomes distinct <= 7
  - flat patch >= 8 cells
  - neighbor height delta <= 7 blocks
  - surface water <= 25%
  - surface grass >= 3%

placements:
  spawn: random_safe radius 1 attempts 32
  muster: offset_from spawn [6, 0, 0]
  farm_patch: flat_patch_center
  pen_corner: offset_from spawn [8, 0, 8]
  wood_line: offset_from spawn [-8, 0, 4]

find: 3 solutions max 100 seeds

server: ./server.local.yaml
