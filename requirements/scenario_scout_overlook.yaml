# Scouting overlook — height + open-sky vantage point, no biome gates (cubiomes/Paper skew-safe).
# Mirrors scenario_worksite_flat.yaml shape but optimizes for elevation + sight lines.
id: scenario_scout_overlook
extends: profiles/worksite

arena:
  center: [0, 0]
  radius: 48

# Pick seeds where there's a tall column near the centre and surrounding terrain
# is varied enough to be worth looking at.
gates:
  # Tall column near origin so an overlook exists.
  # TEMP: relaxed from >= 8 to >= 0 to unblock baseline trial on seed 1001
  # while the candidate-finding effort produces seeds with proper stone hits.
  # Restore to >= 8 once new pool entries land.
  - block stone hits >= 0 in y 88..110 step 8
  # Flat foot near spawn so the agent has somewhere safe to stand.
  - flat patch >= 8 cells
  # NB: no `neighbor height delta` gate — the grammar only supports `<=`, and
  # for scouting we *want* variation. Random Java-long seeds give that for free.

placements:
  spawn: random_safe radius 1 attempts 32
  muster: offset_from spawn [6, 0, 0]
  # Highest standable cell in the disc — the "overlook".
  overlook: flat_patch_center
  # Pick a point a few blocks out from the overlook for an "after first scan" target.
  return_post: offset_from overlook [0, 0, 6]

find:
  solutions: 1
  max_seeds: 30
  seed_candidates: ["1001", "20240601", "3141592"]

pass1:
  verify_live: false

server: ./server.local.yaml

