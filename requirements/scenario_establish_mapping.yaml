# Establishment mapping — wide diverse disc; fleet ranges to map terrain,
# name landmarks, drop in-world signs + torches, and reconcile a shared
# personal-POI overlay. Run ends when Steward judges coverage sufficient
# (no hard wall-clock); scripts/establish-mapping-check.py grades.
id: scenario_establish_mapping
extends: profiles/worksite

arena:
  center: [0, 0]
  radius: 64

# Gate rationale (relaxed for Phase D validation, 2026-06-04):
# * Keep the flat-patch gate — muster + starter chest still need a safe
#   landing spot (random_safe placements depend on it).
# * Drop `block stone hits >= 4 in y 80..100 step 6` — that gate biased
#   selection toward mountainous discs. Mapping wants rolling, varied
#   terrain workers can range over without constant pillar/escape.
# * `biomes distinct >= 2` (down from 3 for Phase D): mapcatalog's
#   pass1 biome probe samples a relatively small slice and almost no
#   seeds in the pool show 3+ biomes (13/13 pass1 rejects observed at
#   1 or 2 biomes). Drop to 2 to land a real disc; restore to 3 once
#   the probe is widened.
#
# Pass2 gates removed for Phase D validation:
#   `neighbor height delta <= 6` and `surface grass >= 20%` are correct
#   IN INTENT but the current mapcatalog pass2 probe returns identical
#   metrics for every candidate seed (reads from the loaded world
#   instead of materializing each one), so refresh found 0/23 valid
#   seeds with them. Restore once the probe materializes per-seed
#   worlds. Phase D's grader does not depend on either.
gates:
  - flat patch >= 8 cells
  - biomes distinct >= 2

placements:
  spawn: random_safe radius 1 attempts 32
  muster: random_safe radius 8 attempts 32
  starter_chest: random_safe radius 8 attempts 32

find:
  solutions: 1
  max_seeds: 40
  # Operator-picked seeds (2026-06-04, Phase D) — try first before
  # falling back to the random stream.
  seed_candidates:
    - "-32456789431833"
    - "-2488795730217298217"
    - "-266683266992121625"

pass1:
  verify_live: false

server: ./server.local.yaml
