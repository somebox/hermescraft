# capability-matrix.yaml — Phase-2 capability test scoreboard
#
# One row per capability test (L0–L4 for now; L5+ deferred per Phase 3 appendix).
#
# Schema per test:
#   id: <level.n>_<slug>            # matches data/test-fixtures/<L>/<id>.yaml
#   bot: <flint|gatherer|either>    # which body the worker drives
#   status: green|red|untested|deferred
#   last_run: <ISO-8601 timestamp or null>
#   consecutive_pass: <int>          # green is "consecutive_pass >= 3"
#   notes: <one-line, especially for known-fail and bug links>
#
# Updated by workers via `hermes kanban complete` metadata.test_id +
# result, which a small tick script folds into this file. For Sprint 0
# we update it by hand to validate the loop.

version: 1
last_updated: 2026-05-09
notes: |
  status semantics (per architecture §6):
    untested  = never run
    red       = last run FAILED, or PASSED but consecutive_pass < 2
    green     = consecutive_pass >= 2 AND no open blocking bug_reports linked to this test
    deferred  = scheduled for a later sprint

