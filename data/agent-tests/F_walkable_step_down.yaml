# F_walkable — 1-block step down; mc move / goto_near (not stair_down into void).
# Context twin: walkable_step_down_use_move.

agent_test_id: F_walkable_step_down
world: landfolk-test

prompt: |
  You are Tester. MC CLI on PATH. You are already at (130, 65, 100) in landfolk-test.

  Goal: stand on the lower platform at (131, 64, 100) — one block down.
  Use ONE command: mc move 131 64 100 (or mc goto_near 131 64 100 1).
  Do not goto spawn, do not stair_down, do not survey.

skills: [minecraft-navigation, minecraft-survival]
max_turns: 4
timeout_seconds: 120

verify_bot_at: { x: 130, y: 65, z: 100, range: 3 }

expect:
  bot_at: { x: 131, y: 64, z: 100, range: 2 }
  mc_verbs_include_any: [move, goto_near]
  mc_cli_invocations_max: 6

verify_after_prep:
  - { block: stone, min_count: 10, radius: 24 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill 128 63 98 134 80 102 minecraft:air"
  - "execute in landfolk-test run fill 129 64 99 132 64 101 minecraft:stone"
  - "execute in landfolk-test run setblock 131 63 100 minecraft:stone"
  - "mvtp Tester landfolk-test"
  - "execute in landfolk-test run tp Tester 130 65 100"
  - "effect clear Tester"
  - "effect give Tester minecraft:saturation 600 1"
  - "clear Tester"

cleanup:
  - "execute in landfolk-test run fill 128 63 98 134 80 102 minecraft:air"
  - "execute in landfolk-test run fill 129 64 99 132 64 101 minecraft:stone"
  - "execute in landfolk-test run tp Tester 52 65 52"
