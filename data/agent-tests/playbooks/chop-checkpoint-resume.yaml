# A3 — checkpoint resume after partial chop (simulated mid-card handoff).
# Prior worker left [run_state] with chopped: 4/8; you resume in chop_loop.

agent_test_id: chop_checkpoint_resume
world: landfolk-test
model: google/gemini-2.5-flash
max_turns: 25
timeout_seconds: 300

skills: [kanban-worker, playbook-wood-chop-tall-tree, minecraft-mining]

prompt: |
  You are a fresh Flint worker reclaiming kanban task {{TASK_ID}} on landfolk-test.

  Card body:

  playbook: wood.chop_tall_tree
  tree: (79, 65, 50)
  target_logs: 8
  deposit_to: chest_wood_test at (82, 65, 52)

  Latest kanban comment from the prior worker (resume from this):

  [run_state]
  playbook: wood.chop_tall_tree
  phase: chop_loop
  completed: [preflight, approach]
  context:
    chopped: 4
    target_logs: 8
    tree: { x: 79, y: 65, z: 50 }

  You already have 4 oak_log in inventory. Collect 4 more, deposit all 8 at the chest,
  write a final `[run_state]` with phase __done__, playbook phase clear, kanban_complete.

expect:
  bot_inventory:
    oak_log: ">=0"
  mc_verbs_include_any: [playbook, collect, deposit]
  mc_cli_invocations_max: 35

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  # A3 arena lives east of A2 (x=74..84) — three arenas side by side at z=45..55.
  - "execute in landfolk-test run fill 74 64 45 86 80 55 minecraft:air"
  - "execute in landfolk-test run fill 74 64 45 86 64 55 minecraft:grass_block"
  - "execute in landfolk-test run setblock 79 65 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 79 66 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 79 67 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 79 68 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 82 65 52 minecraft:chest"
  - "clear Flint"
  - "execute in landfolk-test run give Flint minecraft:wooden_axe 1"
  - "execute in landfolk-test run give Flint minecraft:oak_log 4"
  - "execute in landfolk-test run give Flint minecraft:bread 4"
  - "gamemode creative Flint"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 76 65 50"
  - "execute in landfolk-test run gamemode survival Flint"

cleanup:
  # Fill from y=65 (preserve grass floor). Park Flint at A1 spawn coord.
  - "gamemode creative Flint"
  - "execute in landfolk-test run fill 74 65 45 86 80 55 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 51"
  - "execute in landfolk-test run gamemode survival Flint"
