# A3 — checkpoint resume after partial chop (simulated mid-card handoff).
# Prior worker left [run_state] with chopped: 4/8; you resume in chop_loop.

agent_test_id: chop_checkpoint_resume
world: landfolk-test
model: google/gemini-2.5-flash
max_turns: 25
timeout_seconds: 300

skills: [kanban-worker, playbook-wood-chop-tall-tree, minecraft-mining]

prompt: |
  You are a fresh Flint worker reclaiming kanban task {{TASK_ID}} on landfolk-test.

  Card body:

  playbook: wood.chop_tall_tree
  tree: (40, 65, 0)
  target_logs: 8
  deposit_to: chest_wood_test at (52, 65, 52)

  Latest kanban comment from the prior worker (resume from this):

  [run_state]
  playbook: wood.chop_tall_tree
  phase: chop_loop
  completed: [preflight, approach]
  context:
    chopped: 4
    target_logs: 8
    tree: { x: 40, y: 65, z: 0 }

  You already have 4 oak_log in inventory. Collect 4 more, deposit all 8 at the chest,
  write a final `[run_state]` with phase __done__, playbook phase clear, kanban_complete.

expect:
  bot_inventory:
    oak_log: ">=0"
  mc_verbs_include_any: [playbook, collect, deposit]
  mc_cli_invocations_max: 35

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill 35 64 -5 45 80 5 minecraft:air"
  - "execute in landfolk-test run fill 35 64 -5 45 64 5 minecraft:grass_block"
  - "execute in landfolk-test run setblock 40 65 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 40 66 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 40 67 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 40 68 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 52 65 52 minecraft:chest"
  - "clear Flint"
  - "execute in landfolk-test run give Flint minecraft:wooden_axe 1"
  - "execute in landfolk-test run give Flint minecraft:oak_log 4"
  - "execute in landfolk-test run give Flint minecraft:bread 4"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 40 65 2"

cleanup:
  - "execute in landfolk-test run fill 35 64 -5 45 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
