# A1 — same goal, three card-body arms (prose-minimal / prose-skilled / playbook).
# Card bytes: data/agent-tests/playbooks/includes/chop-oak-8/
#
# Run one arm:
#   scripts/stress.sh chop-prose-vs-playbook --arm playbook
# Matrix (≥5× each arm): see docs/features/baseline-turns-fixture.md

agent_test_id: chop_prose_vs_playbook
world: landfolk-test
model: google/gemini-2.5-flash
max_turns: 30
timeout_seconds: 360

skills: [kanban-worker, minecraft-mining, minecraft-navigation, playbook-wood-chop-tall-tree]

default_arm: playbook

prompt_prefix: |
  You are Flint, a Minecraft worker on kanban task {{TASK_ID}}.
  Use `mc` for all in-world actions. For the kanban board in this session use **`scripts/kanban`** (comment, block, complete, card) — not `kanban_*` Python tools (those are unavailable here). MC_API_URL and MC_USERNAME are set. landfolk-test only.

  Your card body (exact spec):

  {{CARD_BODY}}

  Execute the card to completion: ≥8 oak_log at chest_wood_test (52, 65, 52).
  On success: mc chat done line, kanban_complete with summary.

arms:
  prose-minimal:
    card_body_file: includes/chop-oak-8/body-prose-minimal.txt
    skills: [kanban-worker, minecraft-mining, minecraft-navigation]
  prose-skilled:
    card_body_file: includes/chop-oak-8/body-prose-skilled.txt
    skills: [kanban-worker, minecraft-mining, minecraft-navigation]
  playbook:
    card_body_file: includes/chop-oak-8/body-playbook.txt
    skills: [kanban-worker, minecraft-mining, minecraft-navigation, playbook-wood-chop-tall-tree]
    expect_extra:
      mc_verbs_include_any: [playbook]

expect:
  bot_inventory:
    oak_log: ">=0"
  mc_cli_invocations_max: 45

# verify_after_prep disabled: arena is rcon-verified at prep time (setblocks return
# "Changed the block at ..."), but bot's mineflayer view stays stale on the
# spawn chunk until the agent moves and triggers chunk-load packets. Re-enable
# when arena verify moves to a server-side rcon probe instead of /nearby.
# verify_after_prep:
#   - { block: oak_log, min_count: 8, radius: 64 }

prep: &chop_oak_prep
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  # Arena bounding box (50..60 x, 64..80 y, 45..55 z) — wide enough that the
  # tree column at (55,*,50) and the chest at (52,65,52) are both inside one
  # contiguous grass slab with no missing-floor gaps. Earlier layout put the
  # tree at (40,*,0) ~53 blocks from the chest with a void gap between — the
  # agent burned 30+ nav calls bridging dirt across it, drowning the
  # playbook-discipline signal A1 is trying to measure.
  - "execute in landfolk-test run fill 50 64 45 60 80 55 minecraft:air"
  - "execute in landfolk-test run fill 50 64 45 60 64 55 minecraft:grass_block"
  - "execute in landfolk-test run setblock 55 65 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 66 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 67 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 68 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 69 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 70 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 71 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 55 72 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 52 65 52 minecraft:chest"
  - "execute in landfolk-test run data merge block 52 65 52 {Items:[{Slot:0b,id:\"minecraft:oak_log\",Count:1b}]}"
  - "execute in landfolk-test run setworldspawn 52 65 52"
  - "execute in landfolk-test run give Flint minecraft:wooden_axe 1"
  - "execute in landfolk-test run give Flint minecraft:bread 8"
  - "gamemode creative Flint"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run gamemode survival Flint"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"

cleanup: &chop_oak_cleanup
  # Fill range starts at y=65 to preserve the y=64 grass floor — earlier
  # y=64..80 wipe removed the block under Flint's tp landing and the
  # respawn-loop killed mineflayer's position cache. Creative bracket adds
  # a second safety net.
  - "execute in landfolk-test run kill @e[type=!player]"
  - "gamemode creative Flint"
  - "execute in landfolk-test run fill 50 65 45 60 80 55 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run gamemode survival Flint"
