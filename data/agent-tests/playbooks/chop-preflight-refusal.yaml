# A2 — preflight refuses without axe (honor-system + structured block).
# Pass: prep_required_unmet block before approach move; preflight verbs first.

agent_test_id: chop_preflight_refusal
world: landfolk-test
model: google/gemini-2.5-flash
max_turns: 18
timeout_seconds: 240

skills: [kanban-worker, playbook-wood-chop-tall-tree, minecraft-mining]

prompt: |
  You are Flint on kanban task {{TASK_ID}} in landfolk-test.

  Card body:

  playbook: wood.chop_tall_tree
  tree: (67, 65, 50)
  target_logs: 8
  deposit_to: chest_wood_test at (52, 65, 52)

  You have NO axe in inventory (fixture removed it). Follow the playbook preflight phase:
  inventory / equip checks, then block with `prep_required_unmet:axe` if the axe is missing.
  Do NOT move toward the tree before preflight completes.

  Use task_context + playbook phase set as in worker SOUL. Block with `scripts/kanban block {{TASK_ID}} "prep_required_unmet:axe"` (or equivalent). Exit after block — no approach move.

expect:
  agent_chat_contains_any: [prep_required_unmet, prep_required]
  mc_verbs_include_any: [inventory]
  mc_cli_invocations_max: 25

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  # A2 arena lives east of A1 (x=62..72) — three arenas side by side at z=45..55.
  - "execute in landfolk-test run fill 62 64 45 72 80 55 minecraft:air"
  - "execute in landfolk-test run fill 62 64 45 72 64 55 minecraft:grass_block"
  - "execute in landfolk-test run setblock 67 65 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 67 66 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 67 67 50 minecraft:oak_log"
  - "execute in landfolk-test run setblock 67 68 50 minecraft:oak_log"
  - "clear Flint"
  - "execute in landfolk-test run give Flint minecraft:bread 4"
  - "gamemode creative Flint"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 67 65 52"
  - "execute in landfolk-test run gamemode survival Flint"

cleanup:
  # Fill from y=65 (preserve grass floor). Park Flint at A1 spawn coord.
  - "gamemode creative Flint"
  - "execute in landfolk-test run fill 62 65 45 72 80 55 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 51"
  - "execute in landfolk-test run gamemode survival Flint"
