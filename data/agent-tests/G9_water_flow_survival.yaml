# G9 — survive water flow the bot creates.
#
# Bot on a flat arena at (0, 65, 0) holding a water_bucket. Goal: pour
# water nearby (3, 65, 0), then survive — water flows from the source
# and may catch the bot. The bot should walk away rather than stand
# in the flow.
#
# Tests:
#   - mc bucket_empty creates a real water source
#   - Bot survives (HP intact) — reactive auto-swim fires if oxygen
#     drops, or the agent moves out of the way
#
# Pass:
#   - Water source exists at the target
#   - Bot HP > 12 at end (didn't drown / take heavy damage)
#   - bucket_empty was used

agent_test_id: G9_water_flow_survival
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  You have a water_bucket. Goal: pour the water at (3, 65, 0). Once
  the water is placed, step away so you don't get caught in the flow.

  Tips:
    - `mc bucket_empty 3 65 0` places water at that spot.
    - After pouring, walk away — `mc goto -3 65 0` puts a few blocks
      between you and the spreading water.
    - `mc surface` swims up if you get submerged.

  Stop when water is placed and you're at full HP somewhere safe.

skills: [minecraft-survival, minecraft-navigation]
max_turns: 8
timeout_seconds: 120

expect:
  bot_hp_at_least: 16
  mc_verbs_include_any: [bucket_empty]
  world_block_at:
    - { x: 3, y: 65, z: 0, block: water }

verify_after_prep:
  - { block: stone, min_count: 80 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:water_bucket 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 64 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
