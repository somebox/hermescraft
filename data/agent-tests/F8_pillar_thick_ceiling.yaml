# F8 — pillar escape through a thick ceiling.
#
# Bot is in a tiny cave underground with a 10-block-thick stone ceiling
# above it. To escape, the agent must repeatedly pillar-up + dig overhead
# until it punches through to open air.
#
# Arena geometry:
#   - Stone column y=62..75 (14 blocks thick total)
#   - Carved cavity at y=64..65 (3x3 footprint) — bot's room
#   - Bot spawns at 0, 64, 0 (feet on stone at y=63)
#   - Ceiling: y=66..75 = 10 blocks of stone
#   - Open air starts at y=76 (surface)
#
# What the bot needs to do:
#   - `mc pillar_step dirt 10` — pillar primitive ALREADY has an
#     ensureHeadroom step that should dig y+1 and y+2 each iteration
#     before placing. If iteration works correctly it punches through.
#   - If pillar_step bails (consecutive_fails >= 2 OR shaft_trap when
#     above is still solid), the agent should fall back to
#     `mc dig 0 <Y> 0` for each ceiling block, then re-pillar.
#
# Why this test exists (the bug it reproduces):
#   In the wild we see bots get stuck underground: pillar_step places
#   one block, the next jump hits the ceiling, ensureHeadroom's b.dig
#   call fails silently (try/catch swallows reach/LoS errors), pillar
#   returns null, two consecutive nulls → break. The agent reports
#   "PILLAR_FAILED — headroom blocked" but doesn't iterate dig-then-
#   pillar to break through the remaining ~8 blocks of stone above.
#   A correctly-working agent should either:
#     (a) call pillar_step with a higher count that iterates dig+place
#         each step until the surface is reached, OR
#     (b) on PILLAR_FAILED / shaft_trap, mc dig the cells above its
#         head one at a time, then retry pillar_step.
#
# Pass criteria:
#   - Final bot y >= 76 (on the surface).
#   - Total mc/cli ≤ 25 (agent has budget to iterate, not infinite).

agent_test_id: F8_pillar_thick_ceiling
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  Goal: reach y >= 76 (the surface above your cave).

  Your situation: you are in a 3x3 underground cave at (0, 64, 0). The
  ceiling is THICK — 10 solid stone blocks straight up before you reach
  open air. The walls are also stone. You have a stone_pickaxe (mines
  stone fast) and 32 dirt (for pillaring).

  Tools you'll need:
    - `mc pillar_step dirt 10` — jumps and places a block underfoot,
      repeating. It will try to dig +1 and +2 above your head each step
      to clear headroom, but if the ceiling is thicker than 2 blocks it
      may bail with PILLAR_FAILED or a `shaft_trap` warning.
    - `mc dig <X> <Y> <Z>` — break a specific block. Use this on the
      ceiling cells directly above you when pillar_step bails.
    - `mc status` — confirms your y position. Loop until y >= 76.

  Strategy when pillar_step bails midway:
    - Check `mc status` for current y.
    - Dig the next 3-4 ceiling cells: `mc dig 0 <Y+2> 0` etc.
    - Resume `mc pillar_step dirt 10`.
    - Repeat until y >= 76.

  Stop once your foot y is 76 or higher.

skills: [minecraft-survival, minecraft-mining, minecraft-navigation]
max_turns: 20
timeout_seconds: 480

expect:
  bot_y_at_least: 76
  mc_cli_invocations_max: 25

verify_after_prep:
  # The cavity is 3x3x2 = 18 air cells inside a stone column. Confirm
  # the stone walls/ceiling are present (10-block ceiling = ~90 stone
  # cells just in the 3x3 ceiling column; arena_floor + walls are extra).
  - { block: stone, min_count: 100 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  # Reset arena: clear from way below to way above; we'll rebuild.
  - "execute in landfolk-test run fill -10 50 -10 10 100 10 minecraft:air"
  # Bedrock floor at y=50 keeps the bot from infinitely falling on bugs.
  - "execute in landfolk-test run fill -10 50 -10 10 50 10 minecraft:bedrock"
  # Solid stone column from y=62 up to y=75 (14 blocks tall).
  - "execute in landfolk-test run fill -5 62 -5 5 75 5 minecraft:stone"
  # Carve the 3x3x2 cavity at y=64..65, centered on (0, _, 0).
  - "execute in landfolk-test run fill -1 64 -1 1 65 1 minecraft:air"
  # TP bot to floor center, give equipment, prep effects.
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 64 0"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:stone_pickaxe 1"
  - "give Flint minecraft:dirt 32"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 50 -10 10 100 10 minecraft:air"
  - "execute in landfolk-test run fill -10 50 -10 10 50 10 minecraft:bedrock"
  - "execute in landfolk-test run fill -10 51 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
