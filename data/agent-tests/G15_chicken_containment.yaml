# G15 — bot lures a wild chicken into a pen and contains it ALIVE.
#
# Strict test of the lure-into-pen path. Setup: a 9x9 pen with a closed
# oak_fence_gate on the north side. A wild chicken wanders outside. Bot
# has wheat_seeds and an iron_sword (sword is for swapping hands, NOT
# killing — the chicken must end alive INSIDE the pen).
#
# Realistic workflow:
#   1. Lure chicken close to the gate (outside).
#   2. Open the gate (`mc interact`).
#   3. Lure chicken DEEP into the pen — bot walks to a far corner, the
#      chicken follows all the way in.
#   4. Close the gate (`mc interact` again — it toggles).
#   5. Swap to a non-attractive item (`mc equip iron_sword`) so the
#      chicken stops following the bot.
#   6. Wait a few seconds for the chicken to drift away from the gate.
#   7. Exit through the gate (`mc through`) when no chicken is near it.
#
# Pass criteria:
#   - Chicken is ALIVE (zero feathers in bot inventory).
#   - Chicken is INSIDE the pen (interior or gate row).
#   - Chicken is NOT outside the pen.
#   - Bot is outside the pen at end.

agent_test_id: G15_chicken_containment
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  Setup:
    - You stand at (0, 65, -6), outside a 9x9 fenced pen. Pen
      perimeter at x=-4..4, z=-4..4 (Y=65). Pen interior is
      x=-3..3, z=-3..3.
    - The pen has a CLOSED oak_fence_gate at (0, 65, -4) on the
      north side, directly between you and the pen.
    - A wild chicken is at (0, 65, -7), just north of you.
    - You have 16 wheat_seeds and 1 iron_sword. The sword is for
      SWAPPING HANDS later, not killing — the chicken must END
      ALIVE INSIDE THE PEN. Do NOT use `mc hunt` and do NOT attack
      the chicken with the sword.

  Execute this exact sequence:
    1. `mc lure chicken 0 65 -5` — bring chicken next to the gate
       from the outside.
    2. `mc interact 0 65 -4` — open the gate.
    3. `mc lure chicken 0 65 0` — walk into the pen; the chicken
       follows you through the open gate.
    4. `mc lure chicken 0 65 2` — walk DEEPER into the pen so the
       chicken follows all the way in, away from the gate.
    5. `mc interact 0 65 -4` — close the gate. (It toggles state.)
    6. `mc equip iron_sword` — switch hands. The chicken stops
       following you because you're no longer holding its food.
    7. Wait 4 seconds, then `mc nearby 8` to verify the chicken is
       NOT next to the gate.
    8. `mc through 0 65 -4 0 65 -6` — exit through the gate. The
       safety check (`ANIMAL_AT_GATE`) will refuse if a chicken is
       within 1.5 blocks of the gate. If you get that error, wait
       4 more seconds and retry. If the bot is having trouble
       leaving, lure the chicken further south first (`mc goto 0
       65 3` then back to the gate).

  Do not narrate plans. Run each command one at a time via terminal;
  do NOT batch them in execute_code Python scripts.

skills: [minecraft-survival]
max_turns: 18
timeout_seconds: 360
post_wait_seconds: 5

expect:
  bot_did_not_die: true
  bot_hp_at_least: 16
  # Must have used lure. Hunt is explicitly forbidden by the prompt.
  mc_verbs_include_any: [lure]
  # No feathers = chicken not killed. (Hunt would have dropped 1+.)
  bot_inventory_excludes:
    feather: 1
    chicken: 1
  # Bot ended OUTSIDE the pen
  bot_at: { x: 0, y: 65, z: -6, range: 4 }
  # Chicken alive AND inside the pen volume (including gate row).
  entity_in_bbox:
    # Inside the pen — at least 1 chicken (alive, contained).
    - { type: chicken, bbox: { x1: -4, y1: 64, z1: -4, x2: 4, y2: 66, z2: 4 }, min_count: 1 }
    # No chicken in any of the four outside strips.
    - { type: chicken, bbox: { x1: -10, y1: 63, z1: -10, x2: 10, y2: 67, z2: -5 }, max_count: 0 }
    - { type: chicken, bbox: { x1: -10, y1: 63, z1: 5, x2: 10, y2: 67, z2: 10 }, max_count: 0 }
    - { type: chicken, bbox: { x1: -10, y1: 63, z1: -4, x2: -5, y2: 67, z2: 4 }, max_count: 0 }
    - { type: chicken, bbox: { x1: 5, y1: 63, z1: -4, x2: 10, y2: 67, z2: 4 }, max_count: 0 }

verify_after_prep:
  - { block: oak_fence, min_count: 31 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -15 65 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:grass_block"
  # 9x9 fenced pen with a CLOSED fence_gate at (0,65,-4)
  - "execute in landfolk-test run fill -4 65 -4 4 65 -4 minecraft:oak_fence"
  - "execute in landfolk-test run fill -4 65 4 4 65 4 minecraft:oak_fence"
  - "execute in landfolk-test run fill -4 65 -4 -4 65 4 minecraft:oak_fence"
  - "execute in landfolk-test run fill 4 65 -4 4 65 4 minecraft:oak_fence"
  - "execute in landfolk-test run setblock 0 65 -4 minecraft:oak_fence_gate[facing=north,open=false]"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 -6 180 0"
  # Chicken north of bot, aligned with the gate on the x-axis. AI on.
  - "execute in landfolk-test run summon minecraft:chicken 0 65 -7 {NoAI:0b,Age:0}"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:wheat_seeds 16"
  - "give Flint minecraft:iron_sword 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -15 64 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
