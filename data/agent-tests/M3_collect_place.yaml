# M3 — navigate + collect + place.
#
# GENERATED FROM scripts/gen-place-test.py — DO NOT HAND-EDIT cell lists.
# Edit MAZE / CONFIG at the top of that script and re-run.
#
# Maze layout (col c → x = c + -12, row r → z = r + -3;
# # = wall, D = door slot, digit = chest, . = open floor):
#   #########################
#                    #      #
#   ########D####### #    # #
#   #     #        # # ##   #
#   #  1  #######  # # ##  ##
#   #              #     # 2#
#   ##################D######
#
# Pre-built: ALL maze walls (cobble), 3 doors (entrance D0 + internal D1
# + rear D2), outer perimeter ring (obsidian). Bot does no building of
# the maze itself — it only collects items and places them at target
# cells. 10 missions; later ones place into main corridors,
# creating obstacles the remaining missions must route around.

agent_test_id: M3_collect_place
world: landfolk-test
description: |
  Solo navigation + retrieve + place test on a pre-built maze. 10
  missions: walk to a source (chest inside/outside the maze, or a
  mineable block), collect/mine 1 item, walk to a target cell, place it.
  Last 2 placements drop items in main corridors as navigation obstacles
  for the remaining missions. Tests pathfinder + LOS + door interact +
  navigation around bot-placed obstacles.

bots:
  - name: Builder
    port: 3002
    profile: builder

world_setup:
  - rcon: 'execute in landfolk-test run time set 5000'
  - rcon: 'execute in landfolk-test run gamerule doDaylightCycle true'
  - rcon: 'execute in landfolk-test run gamerule keepInventory true'
  - rcon: 'execute in landfolk-test run gamerule doMobSpawning false'
  - rcon: 'execute in landfolk-test run gamerule commandModificationBlockLimit 100000'
  - rcon: 'execute in landfolk-test run weather clear 9999'
  - rcon: 'execute in landfolk-test run kill @e[type=!player]'
  - rcon: 'execute in landfolk-test run kill @e[type=!player]'

  # Force-load the chunks (forceload runs in the EXECUTOR's dimension
  # which is the overworld for rcon-cli — so 'execute in <world> run' on
  # forceload doesn't actually target landfolk-test. Acceptable here
  # because the bot's presence loads the chunks once it connects.
  - rcon: 'execute in landfolk-test run forceload add -21 -7 17 7'

  # Arena floor: stone → dirt → obsidian (no grass — keeps the bot from digging through).
  - rcon: 'execute in landfolk-test run fill -21 62 -7 17 71 7 air replace'
  - rcon: 'execute in landfolk-test run fill -21 62 -7 17 62 7 minecraft:stone'
  - rcon: 'execute in landfolk-test run fill -21 63 -7 17 63 7 minecraft:dirt'
  - rcon: 'execute in landfolk-test run fill -21 64 -7 17 64 7 minecraft:grass_block'

  # Maze cobble walls (pre-built, 3 high — y=65..67). 2-tall walls let
  # the bot climb on top via chests/gates and walk the perimeter; 3 tall
  # blocks all known wall-climbing exploits.
  - rcon: 'execute in landfolk-test run fill -12 65 -3 12 65 -3 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run fill -12 66 -3 12 66 -3 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run fill -12 67 -3 12 67 -3 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 5 65 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 5 66 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 5 67 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 12 65 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 12 66 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run setblock 12 67 -2 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run fill -12 65 -1 -5 65 -1 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run fill -12 66 -1 -5 66 -1 minecraft:cobblestone'
  - rcon: 'execute in landfolk-test run fill -12 67 -1 -5 67 -1 minecraft:cobblestone'
