  # Outer perimeter obsidian ring (y=65..67, 3-tall) — single gap at west entrance.
  - rcon: 'execute in landfolk-test run fill -13 65 -4 -13 67 -3 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 -1 -13 67 4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 13 65 -4 13 67 4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 -4 13 67 -4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 4 13 67 4 minecraft:obsidian'

  # 3 oak_fence_gates with explicit facing — pathfinder traverses these.
  - rcon: 'execute in landfolk-test run setblock -12 65 -2 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -12 66 -2 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -12 65 -2 minecraft:oak_fence_gate[facing=east,open=false,in_wall=false]'
  - rcon: 'execute in landfolk-test run setblock -4 65 -1 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -4 66 -1 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -4 65 -1 minecraft:oak_fence_gate[facing=north,open=false,in_wall=false]'
  - rcon: 'execute in landfolk-test run setblock 6 65 3 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock 6 66 3 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock 6 65 3 minecraft:oak_fence_gate[facing=south,open=false,in_wall=false]'

  # Initial chest stocking for C1 and C2 (in-maze chests).
  - rcon: 'execute in landfolk-test run setblock -9 65 1 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -9 65 1 minecraft:chest{Items:[{Slot:0b,id:"minecraft:cobblestone",count:8},{Slot:1b,id:"minecraft:stone_pickaxe",count:1},{Slot:2b,id:"minecraft:bread",count:6}]}'
