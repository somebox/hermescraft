  - rcon: 'execute in landfolk-test run setblock 11 65 2 minecraft:chest{Items:[{Slot:0b,id:"minecraft:cobblestone",count:8},{Slot:1b,id:"minecraft:stone_pickaxe",count:1},{Slot:2b,id:"minecraft:bread",count:6}]}'

  # Outside-the-maze chest at (-17, 65, -2) — west of spawn.
  - rcon: 'execute in landfolk-test run setblock -17 65 -2 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -17 65 -2 minecraft:chest{Items:[{Slot:0b,id:"minecraft:bread",count:4}]}'

  # Spawn — outside the perimeter ring, facing east.
  - rcon: 'execute in landfolk-test run setworldspawn -16 65 -2'
  - rcon: 'execute in landfolk-test run spawnpoint Builder -16 65 -2'

post_connect_setup:
  - rcon: 'execute in landfolk-test run effect clear Builder'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:saturation 5 10'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:instant_health 1 4'
  - rcon: 'execute in landfolk-test run clear Builder'
  - rcon: 'execute in landfolk-test run clear Builder'
  - rcon: 'execute in landfolk-test run xp set Builder 0 levels'
  - rcon: 'execute in landfolk-test run give Builder minecraft:stone_pickaxe 1'
  - rcon: 'execute in landfolk-test run tp Builder -16 65 -2 90 0'

marks:
  C1: { x: -9, y: 65, z: 1, note: "In-maze chest 1 (left)" }
  C2: { x: 11, y: 65, z: 2, note: "In-maze chest 2 (right)" }
  C_OUT: { x: -17, y: 65, z: -2, note: "Outside-the-maze chest (west of spawn)" }
  D0: { x: -12, y: 65, z: -2, note: "Maze entrance door" }
  D1: { x: -4, y: 65, z: -1, note: "Internal door (top)" }
  D2: { x: 6, y: 65, z: 3, note: "Rear door (bottom)" }
  ENTRY: { x: -16, y: 65, z: -2, note: "Bot spawn" }

phases:
  - id: M1
    parallel: false
    missions:
      - id: M1
        to: Builder
        pre_rcon:
          - 'execute in landfolk-test run setblock -2 65 2 minecraft:andesite'
        text:
          - '@builder M1: walk to the andesite block at (-2,65,2), `mc dig -2 65 2` then `mc collect andesite 1`.'
          - 'Then walk to target (1,65,1) and `mc place andesite 1 65 1`.'
          - 'Verify with `mc inspect 1 65 1`, then emit `M1 DONE`.'
        deadline_tick: 3600
        done_keyword: "M1 DONE"
        keyword_from: Builder
        verify_after_keyword:
          world: landfolk-test
          checks:
            - label: M1_placed
              cells:
                - [1, 65, 1]
              allow: [andesite]
              min_match: 1

  - id: M2
