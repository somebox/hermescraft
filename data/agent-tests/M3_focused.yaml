  - rcon: 'execute in landfolk-test run effect clear Builder'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:saturation 5 10'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:instant_health 1 4'
  - rcon: 'execute in landfolk-test run clear Builder'
  - rcon: 'execute in landfolk-test run xp set Builder 0 levels'
  - rcon: 'execute in landfolk-test run give Builder minecraft:stone_pickaxe 1'
  - rcon: 'execute in landfolk-test run tp Builder -16 65 -2 90 0'

marks:
  C1: { x: -9, y: 65, z: 1, note: "In-maze chest 1 (left)" }
  C2: { x: 11, y: 65, z: 2, note: "In-maze chest 2 (right)" }
  C_OUT: { x: -17, y: 65, z: -2, note: "Outside-the-maze chest" }
  D0: { x: -12, y: 65, z: -2, note: "Maze entrance gate" }
  D1: { x: -4, y: 65, z: -1, note: "Internal gate (top)" }
  D2: { x: 6, y: 65, z: 3, note: "Rear gate (bottom)" }
  ENTRY: { x: -16, y: 65, z: -2, note: "Bot spawn" }

phases:
  - id: F1
    parallel: false
    # Why this exists: F71 LOS-aware goto_near + F67 dig-LOS
    missions:
      - id: F1
        to: Builder
        pre_rcon:
          - 'execute in landfolk-test run setblock -2 65 2 minecraft:andesite'
        text:
          - '@builder F1: walk to the andesite block at (-2,65,2), `mc dig -2 65 2` then `mc collect andesite 1`.'
          - 'Then walk to target (1,65,1) and `mc place andesite 1 65 1`.'
          - 'Verify with `mc inspect 1 65 1`, then emit `F1 DONE`.'
        deadline_tick: 4800
        done_keyword: "F1 DONE"
        keyword_from: Builder
        verify_after_keyword:
          world: landfolk-test
          checks:
            - label: F1_placed
              cells:
                - [1, 65, 1]
              allow: [andesite]
              min_match: 1

  - id: F2
    parallel: false
    # Why this exists: pathfinder D1 traversal + east-half routing
    missions:
      - id: F2
        to: Builder
        pre_rcon:
          - 'execute in landfolk-test run setblock 11 65 2 minecraft:air'
          - 'execute in landfolk-test run setblock 11 65 2 minecraft:chest{Items:[{Slot:0b,id:"minecraft:white_wool",count:1}]}'
        text:
          - '@builder F2: walk to C2 (11,65,2) — gates open automatically as you pathfind through them; `mc withdraw white_wool 1 11 65 2`.'
          - 'Then walk to target (4,65,0) and `mc place white_wool 4 65 0`.'
          - 'Verify with `mc inspect 4 65 0`, then emit `F2 DONE`.'
        deadline_tick: 4800
        done_keyword: "F2 DONE"
        keyword_from: Builder
        verify_after_keyword:
          world: landfolk-test
          checks:
            - label: F2_placed
              cells:
                - [4, 65, 0]
              allow: [white_wool]
              min_match: 1

  - id: F3
    parallel: false
    # Why this exists: D0 entrance fence_gate exit + re-entry
    missions:
      - id: F3
        to: Builder
        pre_rcon:
          - 'execute in landfolk-test run setblock -17 65 -2 minecraft:air'
          - 'execute in landfolk-test run setblock -17 65 -2 minecraft:chest{Items:[{Slot:0b,id:"minecraft:red_wool",count:1}]}'
        text:
          - '@builder F3: walk to outside chest C_OUT (-17,65,-2) (west of spawn, no gate needed); `mc withdraw red_wool 1 -17 65 -2`.'
          - 'Then walk to target (-10,65,0) and `mc place red_wool -10 65 0`.'
          - 'Verify with `mc inspect -10 65 0`, then emit `F3 DONE`.'
        deadline_tick: 4800
        done_keyword: "F3 DONE"
        keyword_from: Builder
        verify_after_keyword:
          world: landfolk-test
          checks:
            - label: F3_placed
              cells:
                - [-10, 65, 0]
              allow: [red_wool]
              min_match: 1

warning_lead_ticks: 1000
hard_overtime_ticks: 2000
global_wallclock_max_seconds: 900
poll_interval_seconds: 3
chat_history_count: 30
hermes_session_max_turns: 1500
launch_settle_seconds: 2
