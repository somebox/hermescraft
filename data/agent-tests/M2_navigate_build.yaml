# M2 — navigate + multi-mission solo build.
#
# GENERATED FROM scripts/gen-maze-test.py — DO NOT HAND-EDIT cell lists.
# Edit the MAZE / CONFIG at the top of that script and re-run.
#
# Maze layout (col c → x = c + -12, row r → z = r + -3;
# # = wall, D = door slot, digit = chest, . = open floor):
#   #########################
#                    #      #
#   ########D####### #    # #
#   #     #        # # ##   #
#   #  1  #######  # # ##  ##
#   #              #     # 2#
#   ##################D######
#
# Wall count: 94 cells × 2 y-layers = 188 cobble blocks.
# Build groups: W1 (x ≤ 0) = 49 cells, W2 (x ≥ 1) = 45 cells.

agent_test_id: M2_navigate_build
world: landfolk-test
description: |
  Solo navigate + build chain on a pre-designed maze. One mission per
  contiguous wall run (≤14 cells each). The orchestrator restocks the
  relevant chest just before broadcasting each mission text, forcing
  the bot to return to the chest, withdraw, and build that short fill.
  This stresses navigation between every build step and keeps each
  steward order short. Pass = every phase acks AND build verifies.

bots:
  - name: Builder
    port: 3002
    profile: builder

world_setup:
  - rcon: 'execute in landfolk-test run time set 5000'
  - rcon: 'execute in landfolk-test run gamerule doDaylightCycle true'
  - rcon: 'execute in landfolk-test run gamerule keepInventory true'
  - rcon: 'execute in landfolk-test run gamerule doMobSpawning false'
  - rcon: 'execute in landfolk-test run gamerule commandModificationBlockLimit 100000'
  - rcon: 'execute in landfolk-test run weather clear 9999'
  - rcon: 'execute in landfolk-test run kill @e[type=!player]'
  - rcon: 'execute in landfolk-test run kill @e[type=!player]'

  # Force-load the chunks covering the maze + spawn — without this,
  # setblock commands silently fail ("Could not set the block") in
  # chunks that aren't currently loaded, and chests come back empty.
  - rcon: 'execute in landfolk-test run forceload add -18 -6 16 6'

  # Arena: clear, then stone/dirt/grass stack.
  - rcon: 'execute in landfolk-test run fill -18 62 -6 16 71 6 air replace'
  - rcon: 'execute in landfolk-test run fill -18 62 -6 16 62 6 minecraft:stone'
  - rcon: 'execute in landfolk-test run fill -18 63 -6 16 63 6 minecraft:dirt'
  - rcon: 'execute in landfolk-test run fill -18 64 -6 16 64 6 minecraft:grass_block'

  # Obsidian floor markers — every # cell. Bot stacks cobble at y=65,66.
  - rcon: 'execute in landfolk-test run fill -12 64 -3 12 64 -3 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 5 64 -2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 12 64 -2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -12 64 -1 -5 64 -1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -3 64 -1 3 64 -1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 5 64 -1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 10 64 -1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 12 64 -1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock -12 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock -6 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 3 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 5 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 7 64 0 8 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 12 64 0 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock -12 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -6 64 1 0 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 3 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 5 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 7 64 1 8 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 11 64 1 12 64 1 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock -12 64 2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 3 64 2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 9 64 2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run setblock 12 64 2 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -12 64 3 5 64 3 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 7 64 3 12 64 3 minecraft:obsidian'

  # F61: outer perimeter obsidian ring (y=65..66) — no walking around the maze.
  # Single gap at (x=-13, z=-2) aligned with the maze's west entrance.
  - rcon: 'execute in landfolk-test run fill -13 65 -4 -13 66 -3 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 -1 -13 66 4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill 13 65 -4 13 66 4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 -4 13 66 -4 minecraft:obsidian'
  - rcon: 'execute in landfolk-test run fill -13 65 4 13 66 4 minecraft:obsidian'

  # Chests (C1 at (-9, 65, 1), C2 at (11, 65, 2)).
  # Pre-clear to air — `setblock <chest>` is a no-op ("Could not set the block")
  # when there's already a chest at the coord (e.g., leftover from a prior run),
  # which leaves the NBT items empty. Explicit air clear avoids this footgun.
  - rcon: 'execute in landfolk-test run setblock -9 65 1 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock -9 65 1 minecraft:chest{Items:[{Slot:0b,id:"minecraft:cobblestone",count:64},{Slot:1b,id:"minecraft:cobblestone",count:32},{Slot:2b,id:"minecraft:oak_door",count:1},{Slot:3b,id:"minecraft:stone_pickaxe",count:1},{Slot:4b,id:"minecraft:bread",count:8}]}'
  - rcon: 'execute in landfolk-test run setblock 11 65 2 minecraft:air'
  - rcon: 'execute in landfolk-test run setblock 11 65 2 minecraft:chest{Items:[{Slot:0b,id:"minecraft:cobblestone",count:64},{Slot:1b,id:"minecraft:cobblestone",count:32},{Slot:2b,id:"minecraft:oak_door",count:1},{Slot:3b,id:"minecraft:stone_pickaxe",count:1},{Slot:4b,id:"minecraft:bread",count:8}]}'

  # Spawn — west of the entry, facing east.
  - rcon: 'execute in landfolk-test run setworldspawn -14 65 -2'
  - rcon: 'execute in landfolk-test run spawnpoint Builder -14 65 -2'

post_connect_setup:
  - rcon: 'execute in landfolk-test run effect clear Builder'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:saturation 5 10'
  - rcon: 'execute in landfolk-test run effect give Builder minecraft:instant_health 1 4'
  - rcon: 'execute in landfolk-test run clear Builder'
  - rcon: 'execute in landfolk-test run clear Builder'
  - rcon: 'execute in landfolk-test run xp set Builder 0 levels'
  - rcon: 'execute in landfolk-test run tp Builder -14 65 -2 90 0'

