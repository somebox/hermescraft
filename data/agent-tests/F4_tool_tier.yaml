# F4 — tool-tier loop: agent has wooden_pickaxe (can't mine iron) AND
# stone_pickaxe (the right tool). Iron_ore at known coords.
#
# A naive agent will:
#   mc collect iron_ore 1     (uses wooden_pickaxe, TOOL_INADEQUATE)
#   mc collect iron_ore 1     (same — loop)
# A good agent reads the next_action_hint, equips the stone_pickaxe,
# then succeeds.
#
# Pass criteria:
#   - Agent ends with raw_iron in inventory (iron_ore drops raw_iron).
#   - mc dig/collect/mine called ≤ 4 times in total (no loop).

agent_test_id: F4_tool_tier
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  Task: mine the iron_ore that's nearby (within 5 blocks).

  Tips:
    - Check your inventory with `mc inventory`. You have several tools.
    - If a dig fails with TOOL_INADEQUATE, READ THE HINT — it tells you
      which tool to equip.
    - Don't repeat a failed command with the same setup.

  Stop after you have raw_iron in your inventory.

skills: [minecraft-survival]
max_turns: 10
timeout_seconds: 180

expect:
  bot_inventory:
    raw_iron: ">=1"
  mc_cli_invocations_max: 15

verify_after_prep:
  - { block: iron_ore, min_count: 1 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:iron_ore"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:wooden_pickaxe 1"
  - "give Flint minecraft:stone_pickaxe 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 64 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
