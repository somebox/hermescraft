# G12 — bot shears 3 sheep in a pen without losing any.
#
# Bot is OUTSIDE a 5x5 pen with 3 unsheared sheep. Bot has shears. Goal:
# shear all 3 by reaching through the fence (4-block reach). Wool drops
# may fall inside the pen; bot is not required to retrieve them — the
# inventory_gained predicate accepts the in-reach pickup pass.

agent_test_id: G12_sheep_harvest_3x
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  Setup:
    - You stand at (0, 65, -4), just OUTSIDE a 5x5 fenced pen.
    - 3 unsheared sheep are contained inside.
    - You have shears in inventory.

  Goal: shear all 3 sheep. Stay OUTSIDE the pen.

  Execute these steps in a loop:
    1. Run `mc look` — face the pen.
    2. Run `mc shear`. The bot will walk to the fence and shear the
       nearest unsheared sheep (reach is ~4 blocks).
    3. If you get SHEEP_ALREADY_SHEARED, you're done.
    4. Otherwise, walk along the OUTSIDE perimeter to find another
       angle if the next sheep is on the far side of the pen.
       `mc goto X 65 Z` with coordinates OUTSIDE the pen (z < -2 or
       z > 2, or x < -2 or x > 2).

  Do not narrate plans. Run each command one at a time via terminal;
  do NOT batch them in execute_code Python scripts.

skills: [minecraft-survival]
max_turns: 16
timeout_seconds: 240
post_wait_seconds: 5

expect:
  bot_did_not_die: true
  bot_hp_at_least: 16
  mc_verbs_include_any: [shear]
  # Bot ends with at least 2 wool (3 sheep should drop ~3-9 wool but
  # some may fall outside reach; 2 is a generous floor).
  bot_inventory:
    white_wool: 2

verify_after_prep:
  - { block: oak_fence, min_count: 16 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:grass_block"
  # 5x5 fenced pen
  - "execute in landfolk-test run fill -2 65 -2 2 65 -2 minecraft:oak_fence"
  - "execute in landfolk-test run fill -2 65 2 2 65 2 minecraft:oak_fence"
  - "execute in landfolk-test run fill -2 65 -2 -2 65 2 minecraft:oak_fence"
  - "execute in landfolk-test run fill 2 65 -2 2 65 2 minecraft:oak_fence"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 -4 180 0"
  # 3 sheep with AI so they actually move and graze; pre-unsheared.
  - "execute in landfolk-test run summon minecraft:sheep -1 65 0 {NoAI:0b,Color:0b,Sheared:0b}"
  - "execute in landfolk-test run summon minecraft:sheep 0 65 1 {NoAI:0b,Color:0b,Sheared:0b}"
  - "execute in landfolk-test run summon minecraft:sheep 1 65 -1 {NoAI:0b,Color:0b,Sheared:0b}"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:shears 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 64 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
