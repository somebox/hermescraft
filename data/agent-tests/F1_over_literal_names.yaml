# F1 — over-literal block names: agent must canonicalize natural-language
# names ("wood", "stone", "rocks") to actual Minecraft block IDs.
#
# Scene: bot at (0,65,0) with 4 birch_log + 2 spruce_log placed at known
# coords. Prompt asks for "4 wood" — there is no block literally named
# "wood" in Minecraft. A naive agent will call:
#   mc find_blocks wood       (returns nothing)
#   mc collect wood 4         (UNKNOWN_BLOCK)
# and loop. A good agent realizes "wood" → any *_log variant; calls
# mc nearby OR mc discover logs (or just mc collect birch_log 4).
#
# Pass criteria:
#   - Agent ends with ≥4 of ANY log variant in inventory.
#   - Agent did NOT spam find_blocks/collect with the literal "wood" name
#     more than twice (loop detection).

agent_test_id: F1_over_literal_names
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  Task: collect 4 wood. (There are some trees nearby.)

  Tips:
    - Block names in Minecraft are specific (oak_log, birch_log, etc.).
      "wood" is not a real block ID — translate to whatever's actually
      around you. Use `mc nearby` or `mc discover logs` to see.
    - Don't loop on UNKNOWN_BLOCK errors — read the hint and adapt.

  When you have 4 logs of any kind, stop and report what you collected.

skills: [minecraft-survival]
max_turns: 10
timeout_seconds: 180

expect:
  bot_inventory_any:
    oak_log: ">=4"
    birch_log: ">=4"
    spruce_log: ">=4"
    jungle_log: ">=4"
    acacia_log: ">=4"
    dark_oak_log: ">=4"
    cherry_log: ">=4"
    mangrove_log: ">=4"
  mc_verbs_include_any: [collect, dig, harvest]

verify_after_prep:
  - { block: birch_log, min_count: 4 }
  - { block: spruce_log, min_count: 2 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  # 4 birch_log standing as a small tree at x=3
  - "execute in landfolk-test run setblock 3 65 0 minecraft:birch_log"
  - "execute in landfolk-test run setblock 3 66 0 minecraft:birch_log"
  - "execute in landfolk-test run setblock 3 67 0 minecraft:birch_log"
  - "execute in landfolk-test run setblock 3 68 0 minecraft:birch_log"
  # 2 spruce_log at x=-3
  - "execute in landfolk-test run setblock -3 65 0 minecraft:spruce_log"
  - "execute in landfolk-test run setblock -3 66 0 minecraft:spruce_log"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:wooden_axe 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 64 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
