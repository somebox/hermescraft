# Building topic: spawn → build_pad → watch_post on {{PROC_WORLD}} (map anchors injected).
agent_test_id: proc_building_flat_pad_watch
world: "{{PROC_WORLD}}"

procedural_map:
  variant: building.flat_pad
  pick: random

prompt: |
  You are the Minecraft bot {{BOT_USERNAME}}. The `mc` CLI is on PATH; MC_API_URL and MC_USERNAME are set.
  You are in world {{PROC_WORLD}} at the scenario spawn.

  Do exactly this:
  1. Run `mc status` once.
  2. Go to the build pad at ({{BUILD_PAD_X}}, {{BUILD_PAD_Y}}, {{BUILD_PAD_Z}}) within 4 blocks (`mc move` / `mc goto`).
  3. Go to the watch post at ({{WATCH_POST_X}}, {{WATCH_POST_Y}}, {{WATCH_POST_Z}}) within 4 blocks.
  4. Run `mc status` and say exactly: platform ok

skills: [minecraft-navigation, minecraft-building, minecraft-mining]
max_turns: 10
timeout_seconds: 180

expect:
  agent_chat_contains_any:
    - platform ok
  bot_at:
    x: {{WATCH_POST_X}}
    y: {{WATCH_POST_Y}}
    z: {{WATCH_POST_Z}}
    range: 4
  mc_cli_invocations_max: 20

prep:
  - "execute in {{PROC_WORLD}} run difficulty peaceful"
  - "execute in {{PROC_WORLD}} run gamerule doMobSpawning false"
  - "execute in {{PROC_WORLD}} run gamerule doDaylightCycle false"
  - "execute in {{PROC_WORLD}} run time set day"
  - "execute in {{PROC_WORLD}} run kill @e[type=!player]"
  - "mvtp {{BOT_USERNAME}} {{PROC_WORLD}}"
  - "execute in {{PROC_WORLD}} run tp {{BOT_USERNAME}} {{SPAWN_X}} {{SPAWN_Y}} {{SPAWN_Z}}"
  - "effect clear {{BOT_USERNAME}}"
  - "effect give {{BOT_USERNAME}} minecraft:saturation 600 1"

cleanup:
  - "execute in {{PROC_WORLD}} run kill @e[type=!player]"
  - "mvtp {{BOT_USERNAME}} landfolk-test"
  - "execute in landfolk-test run tp {{BOT_USERNAME}} 52 65 52"
