# Procedural smoke: Flint navigates spawn → muster on proc-lab.
# Coordinates SPAWN_* / MUSTER_* are filled by scripts/agent-test-from-map.py
# from a catalog map JSON (scripts/scenario-pools.sh map smoke).
#
# Do not use world_block_at here — agent-test.py rcon block probes are landfolk-test only.

agent_test_id: proc_smoke_map_anchor
world: proc-lab

procedural_map:
  variant: smoke
  pick: random

prompt: |
  You are the Minecraft bot Flint. The `mc` CLI is on PATH; MC_API_URL and MC_USERNAME are set.
  You are in world proc-lab at the scenario spawn.

  Do exactly this:
  1. Run `mc status` once.
  2. Move to the muster point at ({{MUSTER_X}}, {{MUSTER_Y}}, {{MUSTER_Z}}) using `mc move` and/or `mc goto` until within 4 blocks.
  3. Run `mc status` again and say exactly: anchor ok

skills: [minecraft-navigation]
max_turns: 6
timeout_seconds: 120

expect:
  agent_chat_contains_any:
    - anchor ok
  bot_at:
    x: {{MUSTER_X}}
    y: {{MUSTER_Y}}
    z: {{MUSTER_Z}}
    range: 4
  mc_cli_invocations_max: 14

prep:
  - "execute in proc-lab run difficulty peaceful"
  - "execute in proc-lab run gamerule doMobSpawning false"
  - "execute in proc-lab run gamerule doDaylightCycle false"
  - "execute in proc-lab run time set day"
  - "execute in proc-lab run kill @e[type=!player]"
  - "mvtp Flint proc-lab"
  - "execute in proc-lab run tp Flint {{SPAWN_X}} {{SPAWN_Y}} {{SPAWN_Z}}"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"

cleanup:
  - "execute in proc-lab run kill @e[type=!player]"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 52 65 52"
