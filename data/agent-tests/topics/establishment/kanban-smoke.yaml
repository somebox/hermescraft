# Phase 1 / item 1.5 — minimal kanban smoke.
#
# Proves the bot reads a card-shaped prompt and executes it cleanly. The
# card body is inlined in the prompt (the runner's anchor-substitution
# regex matches any all-caps placeholder, so we keep card body literal).
#
# Real-dispatch (1.6) verifies the actual kanban worker path separately.
agent_test_id: kanban_smoke_establishment
world: {{PROC_WORLD}}

procedural_map:
  variant: establishment.explore
  pick: random

prompt: |
  You are the Minecraft bot {{BOT_USERNAME}} on a kanban task. MC_API_URL and MC_USERNAME are set; `mc` is on PATH.

  Your card body (this IS your task — do exactly what it says, do NOT use `mc goals`):

  [KANBAN_SMOKE] Minimal card-body smoke test for Phase 1 validation.

  Goal: prove you read this card body and execute it in order.

  Steps (do exactly these, in this order, then stop):

    1. `mc chat "card-acknowledged"`  — confirm you read this card
    2. `mc move 6 97 24`               — step 2 east of spawn
    3. `mc chat "card-complete"`       — confirm task done

  That's it. Do not run `mc goals` or `mc observe`. Do not start a side task.
  If a step fails, retry once with the same exact command, then stop.

skills: [minecraft-navigation]
max_turns: 8
timeout_seconds: 90

expect:
  agent_chat_contains_any:
    - card-acknowledged
  agent_chat_contains:
    - card-complete
  bot_at:
    x: 6
    y: 97
    z: 24
    range: 4
  mc_cli_invocations_max: 8

prep:
  - "execute in {{PROC_WORLD}} run difficulty peaceful"
  - "execute in {{PROC_WORLD}} run gamerule doMobSpawning false"
  - "execute in {{PROC_WORLD}} run gamerule doDaylightCycle false"
  - "execute in {{PROC_WORLD}} run time set day"
  - "execute in {{PROC_WORLD}} run kill @e[type=!player]"
  - "mvtp {{BOT_USERNAME}} {{PROC_WORLD}}"
  - "execute in {{PROC_WORLD}} run tp {{BOT_USERNAME}} {{SPAWN_X}} {{SPAWN_Y}} {{SPAWN_Z}}"
  - "effect clear {{BOT_USERNAME}}"
  - "effect give {{BOT_USERNAME}} minecraft:saturation 600 1"

cleanup:
  - "execute in {{PROC_WORLD}} run kill @e[type=!player]"
  - "mvtp {{BOT_USERNAME}} landfolk-test"
  - "execute in landfolk-test run tp {{BOT_USERNAME}} 52 65 52"
