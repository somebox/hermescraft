# G8 — bot survives self-inflicted lava danger (reactive instinct).
#
# Bot starts SAFE with an EMPTY bucket. A lava source is contained in
# a stone box north of the bot. Agent gets a minimal goal: "fetch the
# lava and place it east of you". Agent has no instructions about
# escaping the danger — the reactive layer must do that on its own,
# because in real missions the agent won't have time to react.
#
# Pass criteria:
#   - Lava placed somewhere east of bot spawn (1..3, 65, 0).
#   - Bot HP > 0 at end of post_wait (didn't die — the reactive
#     escape kept it alive).
#   - At least one auto-fired escape_lava event in the bot's
#     autoActionLog during the run.
#
# Why HP > 0 not HP > 12: lava + fire-tick damage is real even with
# saturation regen, but the reactive escape SHOULD prevent death.
# If the bot ends alive (even at low HP), the safety layer worked.

agent_test_id: G8_seal_lava
world: landfolk-test

prompt: |
  You are a Minecraft bot named Flint. The `mc` CLI is on PATH with
  MC_API_URL and MC_USERNAME set.

  You have an empty bucket. There is a lava source at (0, 65, -3).

  Goal, in order:
    1. Walk near the lava source to fill your bucket.
       `mc bucket_fill 0 65 -3` (you'll be close to the box).
    2. Return to your starting position: `mc goto 0 65 0`.
    3. From the starting position, deposit the lava 3 blocks east of
       you: `mc bucket_empty 3 65 0`. You stay where you are — the
       bucket_empty verb has 4-block reach.
    4. Do NOT walk to (3, 65, 0). The lava there is dangerous.

  Stop after the deposit. Don't move further.

skills: [minecraft-survival]
max_turns: 8
timeout_seconds: 180
post_wait_seconds: 10

expect:
  # No deaths. The reactive layer must keep the bot alive — if it dies
  # and respawns, that's a survival failure even if HP is back to 20.
  bot_did_not_die: true
  # Bot finished with substantial HP — the reactive should fire BEFORE
  # the bot catches fire (preemptive on adjacent_lava), not just after.
  # If reactive only kicks in after burning damage, HP drops below 16.
  bot_hp_at_least: 16
  mc_verbs_include_any: [bucket_fill]
  world_block_at:
    - { x: 3, y: 65, z: 0, block: lava }
  # The reactive layer must have fired at least one escape_lava event.
  auto_action_fired: [escape_lava]

verify_after_prep:
  - { block: lava, min_count: 1 }

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -15 65 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:stone"
  # Lava contained in a stone box north of bot, lid on top, west open
  # so bot has an escape lane after depositing east.
  - "execute in landfolk-test run setblock 0 65 -4 minecraft:stone"
  - "execute in landfolk-test run setblock 0 65 -2 minecraft:stone"
  - "execute in landfolk-test run setblock -1 65 -3 minecraft:stone"
  - "execute in landfolk-test run setblock 1 65 -3 minecraft:stone"
  - "execute in landfolk-test run setblock 0 66 -3 minecraft:stone"
  - "execute in landfolk-test run setblock 0 65 -3 minecraft:lava"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  # Brief fire_resistance JUST for the prep settle window so any residual
  # fire from prior runs extinguishes before the test starts. It expires
  # before bucket_empty fires, so the actual lava test isn't masked.
  - "execute in landfolk-test run effect give Flint fire_resistance 5 1"
  - "clear Flint"
  - "give Flint minecraft:bucket 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -15 64 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
