# canonical.yaml — Phase-2 marks (single source of truth)
#
# Edit this file manually. There is no per-bot cache or runtime sync.
# Card bodies SHOULD include literal coords (action_sequence uses coords,
# not @names). Mark names are for human readability and `mc go_mark`.
#
# Schema:
#   <name>:
#     world:   <multiverse-world-name>     # 'world' | 'landfolk-test' | ...
#     coords:  [x, y, z]
#     note:    <one-line description>
#
# Naming: lowercase snake, world-scoped prefix for test arenas (lt_* =
# landfolk-test). Production marks use short names (base, home). G21
# orchestrator seeds lt_* marks via HTTP before each run.

base:
  world: world
  coords: [358, 66, -602]
  note: "production-world landfolk base near Flint's spawn"

# :base1: protect region — sites mirror data/ops/epic-base1-body.yaml.
# Use :base1:/<site> in card bodies (mc go_site) when the region is set up;
# fall back to these coords if you need a private mark.
base_chest:
  world: world
  coords: [365, 65, -593]
  note: "main deposit chest inside :base1: (site=chest)"

home:
