# Genesis v2 — P1 pre-seeded worker cards (lease model).
#
# Only the SCOUT cards are pre-seeded — the colony's opening move, building the
# map immediately. The Steward (P1 epic) files the downstream CHOOSE/GATHER/BUILD
# cards once marks land.
#
# Bodies are a POOL (mox/pip/zee) and these are lease-mode `colony-scout`
# (expertise, no fixed body). Each card leases a body via `mc bot checkout`; the
# LEASE is the body-mutex (one lease per body), so all four scout cards run
# CONCURRENTLY across the pool — three lease mox/pip/zee, the fourth defers until
# one frees. No `[bot:]` tags (the lease, not the assignee, enforces exclusivity).
# Verb-level scouting loop defers to the minecraft-scouting-site skill; lease
# ritual to the minecraft-bot-lease skill. No literal resource coords — the scout
# discovers and marks them.

cards:
  - title: "[GENESIS2:P1] Scout NE from spawn"
    assignee: colony-scout
    initial_status: ready
    body: |
      You are a site scout. Spawn (colony center for now) is
      ({spawn_x},{spawn_y},{spawn_z}). Explore the NORTH-EAST quadrant out to
      ~48 blocks (toward +X / -Z).
      1. `mc bot checkout --near {spawn_x},{spawn_y},{spawn_z} --cap scout` to
         lease a body. On `no free body — defer`: `kanban_block` with reason
         `no_free_body` and stop (do not retry in a loop).
      2. `mc status`, then `skill_view minecraft-scouting-site` and follow it.
         Mark finds on the SHARED map: trees `lt_wood_<n>`, exposed stone
         `lt_stone_<n>`, water `lt_water_<n>`, flat base-sized patches
         `candidate_pad_<n>`. Surface only — no dig/build.
      3. `mc bot release`, then `kanban_complete` with a one-line tally.

