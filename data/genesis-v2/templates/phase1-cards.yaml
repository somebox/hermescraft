         `no free body — defer`: `kanban_block(no_free_body)` and stop.
      2. `mc status`, `skill_view minecraft-scouting-site`, follow it. Mark trees
         `lt_wood_<n>`, stone `lt_stone_<n>`, water `lt_water_<n>`, flat patches
         `candidate_pad_<n>` on the SHARED map. Surface only.
      3. `mc bot release`, then `kanban_complete` with a tally.

