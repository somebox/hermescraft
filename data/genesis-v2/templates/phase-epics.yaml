# Genesis v2 — colony phase epics (procworld stack, specialist architecture).
#
# Five phases with poller-authoritative promotion. P1 starts ready; P2-P5 are
# parked until each prior phase gate passes (phase-checklists.yaml).
# All epics are assigned to colony-planner: the read-only orchestrator
# DECOMPOSES each epic into specialist worker cards bound to a free body.
# Planner never digs/places — it emits cards with literal `mc <verb>` lines.
#
# Placeholders are limited to what is known at boot — only the plains spawn.
# Everything else (base site, resource areas, roads) is discovered at runtime
# via exploration and lives in marks, never hard-written into a card body.
#
# Title convention: `[EPIC] [GENESIS2:Pn] ...` — the [EPIC] prefix fires the
# planner decomposition handler; the [GENESIS2:Pn] tag is the poller's phase
# routing key (see scripts/genesis-v2-poller.py).

epics:
  - phase: P1
    title: "[EPIC] [GENESIS2:P1] Establish base"
    assignee: colony-planner
    initial_status: ready
    body: |
      Establish the colony's first foothold from the bare plains spawn at
      ({spawn_x},{spawn_y},{spawn_z}). You are the Planner: decompose this
      into specialist worker cards and emit them — never act in-world yourself.

      Route each worker card by EXPERTISE assignee — `colony-scout` for
      exploration, `colony-gatherer` for wood/tools, `colony-builder` for
      shelter/chests. Bodies (mox/pip/zee) are a shared POOL: every worker is
      lease-mode and leases a body itself with `mc bot checkout`. So:
        - Each worker card body MUST start with
          `mc bot checkout --near <X,Y,Z> --cap <scout|gather|build>` (use the
          card's target coords — the resource mark or base_anchor) and end with
          `mc bot release` before `kanban_complete`. On `no free body — defer`
          the worker `kanban_block(no_free_body)`.
        - Do NOT add `[bot:]` title tags and do NOT pin a body — the lease (one
          lease per body) is the mutex, and `--near` self-balances work to the
          nearest free body. You assign expertise; the worker takes the body.

      CARD WIRING (critical — read before you create any card):
        - NEVER put THIS phase epic in a worker card's `parents`. A `parent` is a
          BLOCKING dependency (a child stays `todo` until every parent is `done`),
          and this epic is never marked done by you — it auto-completes only when
          its world-gate passes, which itself needs the worker cards to run. Epic
          as a parent = permanent deadlock.
        - Phase membership comes from the TITLE TAG, not a parent edge: give every
          worker card a `[GENESIS2:P1]` title prefix (e.g.
          `[GENESIS2:P1] [BUILD] ...`). That is how the poller groups the phase.
        - Use `parents`/`after:` ONLY to order SIBLING worker cards (e.g.
          BASE-CLEAR after BASE-SELECT, BUILD after BASE-CLEAR). Never to the epic.
        - HANDOFF: whenever you wire a card `after:` a prior step, put a first line
          in the new card's body that reads — Continues from <prior_card_id>: run
          `scripts/kanban card <prior_card_id>` and read its HANDOFF note before acting.
          Assume handoff boundaries are cold and use board comments as truth, so the
          next specialist learns the site already chosen, the body's position, and
          what's stocked instead of redoing or re-deciding finished work.

      Decompose into, roughly in order (wire later cards `after:` the prior
      sibling worker card — never `after:` this epic). SCOUT cards may run in
      parallel (multiple `[GENESIS2:P1]` scouts); BASE-SELECT waits until enough
      `candidate_pad_*` marks exist:
        1. SCOUT (colony-scout) — explore outward from spawn, mark wood
           (`lt_wood_*`), stone (`lt_stone_*`), water (`lt_water_*`) and 1-2 flat
           candidate base pads (`candidate_pad_*`). Surface only. (Pre-seeded.)
        2. BASE-SELECT (colony-builder OR colony-scout) — pick the best
           `candidate_pad_*` from the shared marks (flat, near wood + water,
           route access, room for a later perimeter wall ring — prefer pads with
           clearance beyond the ~10×10 shelter footprint). INSPECT the pad before
           committing: the base must sit on solid, DRY land. WATER in or under the
           footprint is a red flag (gv2-2026-06-16-1: a base sited over water
           drowned the colony) — reject a watery pad and pick another candidate,
           or shift the anchor onto solid ground nearby. This MUST be a real
           worker card with a body and LITERAL verbs — you (the Planner) are
           bodiless and cannot mark. Card body, literal lines:
             `mc bot checkout --near <candidate_pad coords> --cap build`
             `mc go_mark <candidate_pad_name>`
             `mc terrain_top <X> <Z> radius=5 full=true`
               — inspect the ~11×11 footprint: confirm solid ground and a level
               surface; if the top blocks include water (or a steep drop), this
               pad is unsafe — go_mark a different `candidate_pad_*` and re-check.
             `mc mark base_anchor "Colony center" --at <X> <Y> <Z>`
               (or `mc go_mark <candidate_pad>` then `mc mark base_anchor "…"`)
             `mc bot release`
           The P1 gate requires the shared `base_anchor` mark, so this card is a
           hard prerequisite of GATHER and BUILD (wire them `after:` it).
        3. BASE-CLEAR (colony-builder) — clear trees + flatten the ground AROUND
           the base so workers can path in/out and a perimeter wall can sit on
           prepared ground (live-run "built into terrain / cannot exit" stalls
           came from skipping this). CRITICAL SCOPE: the 7×7 shelter footprint
           (base_anchor ± 3 in X/Z) and its solid, drained foundation are
           PRE-RENDERED at boot — do NOT clear_strip or level_ground over that
           footprint, or you will dig up the shelter and expose water below
           (gv2-2026-06-16-1: a worker dug itself into the shelter and got stuck).
           Clear/level only the APRON + APPROACH OUTSIDE base_anchor ± 3. Card
           body, literal lines:
             `mc bot checkout --near <base_anchor coords> --cap build --mark base_anchor`
             `mc go_mark base_anchor`
             `mc fell_tree <x> <z>` for each tree within ~8 blocks of base_anchor
               whose trunk/canopy is OUTSIDE the footprint (shade/seal hazard).
             `mc clear_strip <x1> <z1> <x2> <z2> surface_y=<feet_y> road_mode=true height=8`
               on the door-exit corridor running EAST from base_anchor+4 (the
               door faces east) — clears the path workers walk out onto. Do NOT
               span the footprint.
             `mc level_ground <x1> <z1> <x2> <z2> execute=true target=<feet_y>`
               to flatten the apron rings OUTSIDE base_anchor ± 3 (the approach +
               where the perimeter wall will sit). level_ground is DRY-RUN
               without `execute=true`, caps at 16 columns/call, and digs above +
               fills AIR holes to a solid surface (it does NOT fill water): tile
               the apron into <=16-column rectangles (e.g. 4×4), one
               `mc level_ground ... execute=true` call each. If a rectangle would
               overlap base_anchor ± 3, skip or shrink it.
             If the apron has open water (BASE-SELECT should have avoided this),
               bridge it walkable with
               `mc deck <x1> <z1> <x2> <z2> surface_y=<feet_y> block=cobblestone`
               (decks the air row above the water — bots drown in unfilled water).
               The 7×7 footprint itself is already drained + floored by the boot
               render; only the apron needs this.
             `mc bot release`
           Wire BASE-CLEAR `after:` BASE-SELECT, and BUILD `after:` BASE-CLEAR.
        4. GATHER (colony-gatherer) — first steps MUST satisfy tools before
           leaving base: `mc chest_search` / `mc withdraw` for pickaxe, axe,
           shovel OR `mc craft` them from wood/stone at base chests. Then
           `mc bot checkout --near <lt_wood coords> --cap gather`, collect
           >=16 wood, `mc bot release`. Literal `mc` verb lines only.
        5. BUILD (colony-builder) — shelter walls/roof AND its two storage chests
           are **pre-rendered** at `base_anchor` on new-run (rcon setblocks +
           east-facing door + two chests just inside the door), and those chests
           are already recorded on the shared map as `chest_wood` + `chest_food`.
           Do NOT place or mark chests, do NOT `mc region_create` with protect
           intent, and do NOT free-build walls from prose — everything physical is
           already there. This card just CONFIRMS the base is usable. Card body,
           literal lines:
             `mc bot checkout --near <base_anchor coords> --cap build --mark base_anchor`
             `mc go_mark base_anchor`
             `mc task_context set shelter`
             verify door/egress (walk through the east door once, both ways)
             `mc marks` — confirm `chest_wood` + `chest_food` resolve inside the shelter
             `mc bot release`
           Work only inside the boot-seeded buildable `shelter` region.

      Do NOT `kanban_complete` this epic — it auto-completes when the P1 gate
      passes (base_anchor mark + >=2 chest_* marks [pre-rendered] + active shelter
      region). If
      worker cards for this phase already exist on the board, do not create
      duplicates: just report status and stop. Your job is to decompose and
      monitor, never to declare the phase done.

  - phase: P2
    title: "[EPIC] [GENESIS2:P2] Provision the colony"
    assignee: colony-planner
    initial_status: todo
    body: |
      Make the base self-sustaining for food + basic supply. You are the Planner:
      decompose into specialist worker cards and emit them — never act yourself.

      Same rules as P1: route by EXPERTISE assignee; every worker card body starts
      with `mc bot checkout --near <X,Y,Z> --cap <role>` (use the work-site coords
      from a mark) and ends with `mc bot release` before `kanban_complete`; on
      `no free body — defer` the worker `kanban_block(no_free_body)`. No `[bot:]`
      pins. Do NOT `kanban_complete` this epic — it auto-completes when the P2 gate
      passes. If the cards already exist, report and stop (no duplicates).

      CARD WIRING (same as P1, critical): NEVER put this phase epic in a worker
      card's `parents` (a parent BLOCKS until done; this epic never is → deadlock).
      Tag phase membership with a `[GENESIS2:P2]` title prefix; use `parents`/
      `after:` only to order SIBLING worker cards.

      Decompose into:
        1. FARM (assignee colony-farmer) — `mc bot checkout --near <lt_water_*
           coords> --cap farm`; till a plot beside water (~5×5–6×6); plant seeds;
           mark `farm_wheat` (or `farm_*`); `mc bot release`. Literal `mc` verbs.
           SIZE ↔ GOAL: the food gate is `food.target_min` (currently 16; see
           data/base-goals.yaml), and the render pre-stocks a matching starter
           pantry in `chest_food`. A ~5×5–6×6 plot yields ~8–12 bread/harvest, so
           it replenishes that pantry in ~1–2 harvests. Keep the plot, the food
           target, and the starter pantry (genesis2_lib STARTER_FOOD_COUNT) sized
           together — a big target with a tiny plot is what dead-locked P2 before.
           NOTE: "food" means PREPARED items (bread/cooked); harvested wheat must
           be crafted to bread to count — a harvest-only card produces no food.
        2. STORAGE (assignee colony-builder) — `mc bot checkout --near
           <base_anchor coords> --cap build`; organize + label the base chests so
           wood / stone / food each have a home (record/keep `chest_*` marks);
           `mc bot release`.

      Done when the P2 gate passes (see phase-checklists.yaml): >=3 `lt_*`
      marks on the shared map and >=1 `farm_*` mark (tilled plot). Base chest
      organization is still required on the STORAGE card but inventory quantity
      gates are deferred until chest snapshots populate.

  - phase: P3
    title: "[EPIC] [GENESIS2:P3] Open a mine"
    assignee: colony-planner
    initial_status: todo
    body: |
      Open the colony's first mine and start stone-tier extraction from the base
      established in P1. You are the Planner: decompose into specialist worker
      cards and emit them — never act in-world yourself.

      Route by EXPERTISE assignee (`colony-miner`). Bodies (mox/pip/zee) are a
      shared POOL — every worker is lease-mode. Each worker card body MUST start
      with `mc bot checkout --near <X,Y,Z> --cap mine` and end with `mc bot
      release` before `kanban_complete`; on `no free body — defer` the worker
      `kanban_block(no_free_body)`.

      CARD WIRING (critical): NEVER put this phase epic in a worker card's
      `parents` (a parent BLOCKS until done; this epic only auto-completes on its
      world-gate → deadlock). Tag every worker card `[GENESIS2:P3]`; use
      `parents`/`after:` only to order SIBLING worker cards.

      Decompose into (wire later cards `after:` the prior sibling worker card):
        1. MINE-OPEN (colony-miner) — choose a `lt_stone_*` mark near base_anchor,
           register a mine there and stake a safe descent. Card body, literal
           lines (the worker refines specifics via `skill_view minecraft-mining`):
             `mc bot checkout --near <lt_stone coords> --cap mine`
             `mc go_mark <lt_stone_name>`
             `mc task_context set mine1`     (authorize ad-hoc dig/place for this card)
             `mc mine_open mine1 north 16 stone`   (registers the entrance → per-world mine registry)
             `mc mark mine_mine1`            (shared mine_* mark at the entrance)
             `mc stair_down north 40`        (descend toward the stone band; chain if needed)
             `mc task_context clear`
             `mc bot release`
        2. MINE-SUPPLY (colony-miner, `after:` MINE-OPEN) — extract stone/coal/iron
           and haul it to base storage:
             `mc bot checkout --near <mine entrance coords> --cap mine`
             `mc task_context set mine1`
             `mc mine_resume mine1`          (continue from an open frontier)
             collect cobblestone/coal/iron, then `mc stair_up` / `mc pillar_up` out
             deposit into the base `chest_stone`
             `mc task_context clear`
             `mc bot release`

      Do NOT `kanban_complete` this epic — it auto-completes when the P3 gate
      passes (>=1 mine registered in this world + a `mine_*` mark). If worker
      cards for this phase already exist, report status and stop (no duplicates).

  - phase: P4
    title: "[EPIC] [GENESIS2:P4] Connect resource areas with roads"
    assignee: colony-planner
    initial_status: todo
    body: |
      Tie the colony's resource areas to base with safe, lit, walkable roads. You
      are the Planner: decompose into specialist worker cards and emit them —
      never act in-world yourself.

      Same rules as prior phases: route by EXPERTISE assignee; every worker card
      body starts with `mc bot checkout --near <X,Y,Z> --cap <role>` and ends with
      `mc bot release` before `kanban_complete`; on `no free body — defer` the
      worker `kanban_block(no_free_body)`.

      CARD WIRING (critical): NEVER put this phase epic in a worker card's
      `parents`. Tag every worker card `[GENESIS2:P4]`; use `parents`/`after:`
      only to order SIBLING worker cards.

      Decompose into (one SCOUT-FAR + one ROAD per distant cluster; wire each
      ROAD `after:` its matching SCOUT-FAR):
        1. SCOUT-FAR (colony-scout) — for each `lt_*` resource mark >= 64 blocks
           from `base_anchor`, confirm/refine it on the shared map:
             `mc bot checkout --near <lt_* coords> --cap scout`
             `mc go_mark <lt_* name>`   (verify the resource is there)
             `mc bot release`
        2. ROAD (colony-road, `after:` the matching SCOUT-FAR) — plan + light a
           walkable route from base to that resource:
             `mc bot checkout --near <base_anchor coords> --cap road`
             `skill_view road-planner`  then run the sample → solve → confirm
             roadplan loop to stake + torch the route end-to-end
             `mc mark road_<dest>`      (record the staked route)
             `mc bot release`
           Literal `mc` / `roadplan` lines only — no prose steps.

      Do NOT `kanban_complete` this epic — it auto-completes when the P4 gate
      passes (>=2 far `lt_*` marks + >=1 confirmed road). If worker cards for this
      phase already exist, report status and stop (no duplicates).

  - phase: P5
    title: "[EPIC] [GENESIS2:P5] Steady-state routine"
    assignee: colony-planner
    initial_status: todo
    body: |
      Hold the colony in balance. Run a managed recurring routine: restock low
      resources, do chores (replant, deposit, tidy), and patrol-scout for new
      opportunities. The acceptance is that the colony sustains a resource
      balance over a fixed window without any pipeline starving. Emit specialist
      cards each cycle; never act yourself. Done when the P5 gate passes.
