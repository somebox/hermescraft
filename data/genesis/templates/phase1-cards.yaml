# Phase 1 worker cards. Each card is tagged with `epic: <P1_id>` in its body
# trailer (via `scripts/kanban add --for <P1_id>`) so `scripts/kanban epic
# <P1_id>` lists them. NO `--after <P1_id>` edge — that would wedge the
# children (P1 stays `ready` while orchestrating; children would never
# promote). See prompts/landfolk/steward.md "Filing epic children" for the
# rule. The new `add` verb refuses `--after <epic>` at write time.
#
# ──────────────────────────────────────────────────────────────────────────
# SCAFFOLDING NOTE (added post-g-2026-05-28-5, see reports/genesis/2026-05-28-
# run-5-postmortem.md and this audit thread):
#
# Several card bodies below contain prescriptive procedure — exact walls=
# bboxes, specific withdraw counts, step-by-step `mc move` then `mc region_
# create` sequences. That detail is genesis-as-INTEGRATION-TEST scaffolding:
# it lets us verify the kanban + facade + verify-before-trust architecture
# end-to-end without conflating those failures with agent-decomposition
# failures. The real "@steward build a base" surface should require the
# agent to derive these values from primitives (5x5 perimeter → walls bbox,
# count needed cobble from geometry, choose tools from inventory).
#
# Sections marked `# SCAFFOLD:` below are the prescriptive parts. Relax in
# this order once P1 reliably closes:
#   1. Withdraw counts ("32 cobble + 1 pickaxe") → "compute from geometry + bring tools"
#   2. walls= bbox literal → "derive from 5x5 perimeter centered on anchor"
#   3. SITE step-by-step mc move/create/reload → "anchor a region around the shelter"
#   4. Survey 8-direction × 20/40/60m protocol → "explore + record useful resource directions"
#
# Keep the verification-shape rules (walls= required, is_sheltered output
# semantics) and the architectural rules (--for vs --after, pencil-
# and-eraser) as SOUL doctrine — those generalize.
# ──────────────────────────────────────────────────────────────────────────
cards:
  - title: "[SCOUT] Confirm base anchor"
    assignee: flint
    initial_status: ready
    body: |
      Confirm anchor ({anchor_x}, {anchor_y}, {anchor_z}) is non-water, flat (≤2 block delta within 5m), system_chest visible at ({system_chest_x}, {system_chest_y}, {system_chest_z}).
      Pin base_anchor mark. Do not withdraw from system_chest.

  - title: "[SCOUT] Survey resources around base anchor"
    assignee: flint
    initial_status: ready
    body: |
      Walk the surrounding terrain (a few tens of blocks out in each direction is plenty) and find the nearest cluster of each of the resources Phase 2 will need. Surface-only — no digging.

      Mark the FIRST viable hit per category with the convention `lt_<resource>_<dir>` (private write; Steward reconciles to shared):

      - `lt_wood_<dir>`   — any tree species, large enough to be worth chopping
      - `lt_stone_<dir>`  — exposed stone face you could mine from the surface
      - `lt_water_<dir>`  — water source (HAZARD note if it's a lava lake)
      - `lt_sand_<dir>`   — desert/badlands biome (HAZARD at night)

      **Include quantities in each mark note and in your chat summary.** Steward decides whether a [SUPPLY] card is satisfiable from what you found OR whether the world has a structural shortage — she needs numbers, not "trees exist". Count clusters or visible cells; estimate is fine.

      One closing summary chat line is enough — keep it readable, name the marks and their rough counts.

      **Resource-shortage flag.** If the total of a key resource is well below what a typical Phase-2 supply card would need, end your summary with a `<RESOURCE>_DROUGHT` token (e.g. `TREE_DROUGHT — local supply 18 logs`). Steward will file a follow-up bootstrap card. Do not plant, sow, or extract during this survey — that's downstream work.

      Tools allowed: `mc move`, `mc scene`, `mc inspect`, `mc mark`, `mc chat`. Surface only. Do not engage hostiles; `mc flee 16` if HP ≤ 16. Do not dig. Do not place blocks.

      ## Self-bounded search

      **Don't spend more than ~10 minutes looking.** If after walking the immediate area you haven't found a category, emit the matching `<RESOURCE>_DROUGHT` token and move on; the next phase has follow-up cards for that case. Burning 30+ minutes silently looking for trees that aren't there is worse than emitting `TREE_DROUGHT — searched <area>, 0 logs visible` and closing.

      **Chat a one-line status every ~5 minutes** while you're searching, even if you haven't found anything yet (e.g. `mc chat "<bot>: surveying NW, no wood yet, ~3m in"`). Silence past 5 min reads as stalled and triggers Steward intervention.

      **Verification before complete:** `mc marks | grep ^lt_` should show at least three `lt_*` marks (or one or more documented `<RESOURCE>_DROUGHT` tokens covering the missing categories). Quote that grep line in your `kanban_complete` summary.

  - title: "[CONSTRUCT] Place four base chests on the pad"
    assignee: flint
    initial_status: todo
    after:
      - "[SCOUT] Confirm base anchor"
    body: |
      A 9×9 cobblestone pad is centered on ({anchor_x}, {anchor_y}, {anchor_z}); pad surface is y={anchor_y}-1. Mason's shelter occupies a 5×5 footprint at the pad center. The system_chest sits ON the pad OUTSIDE the shelter footprint.

      **Place four base chests on the pad, all OUTSIDE the 5×5 shelter footprint.** Their layout is your call as long as the constraints hold:

      - On the pad (within ±4 of anchor in x and z).
      - Outside the 5×5 shelter footprint (not within ±2 of anchor in both x and z).
      - At pad-surface +1 (the same y the system_chest sits at).
      - Each chest's column clear of the shelter wall and clear of the system_chest.

      Name them `chest_food`, `chest_wood`, `chest_stone`, `chest_misc`. Which side each lives on is your judgement — pick something tidy.

      **Verification:** after placement, `mc inspect <x> <y> <z>` each — block must be `chest`. Mark each (`mc mark chest_food`, etc.); Steward's reconcile card promotes to shared. Do NOT dig the pad — it's the shelter floor.

  - title: "[CONSTRUCT] Build 5x5 cobble shelter on the pad"
    assignee: mason
    initial_status: todo
    after:
      - "[SCOUT] Confirm base anchor"
    body: |
      Build a small 5×5×3 shelter centered on the anchor ({anchor_x}, {anchor_y}, {anchor_z}) on top of the genesis pad. The previous card placed the base chests outside the shelter footprint, so your wall coords are clear of chest collisions.

      ## Geometry (compute the coords yourself)

      - Footprint: 5×5 cells centered on anchor.
      - Walls: 2 layers (anchor y, anchor y+1). Perimeter cells only — the 9 interior cells of each layer stay as air; that's where the bot's foot+head live when standing inside.
      - Roof: full 5×5 at anchor y+2.
      - Door: replace 2 vertically-stacked cells of one perimeter wall with an oak_door bottom and upper half. South side is conventional but any side works.

      ## Build order — never seal an enterable shelter

      **The shelter must remain enterable at every step.** Either the door is installed, or the door's column is still an open gap. Never close all four walls + roof while the door is still off the bot. Pour the 3 non-door wall sides first, then drop the door halves, then close the door's side. The roof comes last.

      Failing this rule entombs anyone inside (workers, the read-only Steward who may be observing) and forces a costly dig-out.

      ## Hard rules

      - **Walls are perimeter only.** Never `mc fill` across the full 5×5 — that puts cobble inside the shelter. Place each wall side as its own 5×1×1 strip (or smaller).
      - **Whole cobblestone blocks only.** No `cobblestone_slab`, `cobblestone_stairs`, or any half-block variant in walls or roof. Half-blocks fail `mc is_sheltered` — mobs spawn through partial ceilings and light leaks through partial walls. The verification rejects them and you'll have to dig + repair.
      - **Pad is shelter floor.** The pad (anchor ±4 in x/z, y={anchor_y}-1) is off-limits to `mc dig`.

      ## Cobblestone sourcing — system_chest (P1 EXCEPTION)

      Phase 1 workers don't withdraw from system_chest. This shelter card is the **one exception**: withdraw enough cobble to cover walls + roof, plus a stone_pickaxe insurance (in case you misplace a block and need to dig your own placement back out — "pencil + eraser"). Compute the count yourself from the geometry; bring a small buffer.

      System chest is at ({system_chest_x}, {system_chest_y}, {system_chest_z}). Quote the withdrawal in chat: `mc chat "Mason: withdrew <N> cobble + 1 stone_pickaxe from system_chest for shelter — P1 exception"`.

      **Do NOT pillar-down or improvise a mining excursion for cobble.** Multiple prior runs entombed bots that tried. If system_chest is empty, `kanban_block reason="system_chest_empty: shelter exception cannot be honored"` and stop. The `lt_stone_<dir>` mark from the Site Survey card is for **Phase-2 supply runs**, not for P1 shelter cobble.

      ## Verification — both must pass before completing

      Compute the walls bbox from the geometry: it's the 5×5×3 box from (anchor−2, anchor_y, anchor−2) to (anchor+2, anchor_y+2, anchor+2) — substitute the actual integers for your anchor and pass them to `mc is_sheltered walls=<x1>,<y1>,<z1>,<x2>,<y2>,<z2>`.

      1. **Walls intact.** `mc is_sheltered walls=…` returns `ok: true` with `walls_complete: true`. If WALLS_INCOMPLETE: the response lists missing perimeter cells under `missing_cells` — `mc place cobblestone <x> <y> <z>` each, then re-verify.

         **Do NOT run `mc is_sheltered` without the `walls=` argument.** The default form returns the bot's 6 immediate-neighbor cells under `open_neighbors` — those are NOT wall positions, they're the bot's interior-air neighbors. Treating them as gaps and filing a FIX with those coords entombed a bot in a prior run.

      2. **Door usable.** Verify ingress + egress.
         - Stand outside the door, `mc move {anchor_x} {anchor_y} {anchor_z}` (the anchor, inside).
         - From inside, `mc move <outside_coord>` (e.g. a couple blocks past the door on the same side).
         - Both moves must succeed. A shelter you can't enter or leave isn't a shelter — it's a tomb.

      Only after BOTH pass: `mc kanban_complete` with a summary that **quotes the exact walls= bbox you used** so Steward can re-run the same call without guessing.

  - title: "[RECONCILE] Promote chest marks"
    assignee: steward
    initial_status: todo
    after:
      - "[CONSTRUCT] Place four base chests on the pad"
    body: |
      Run scripts/reconcile-marks.py --auto to promote the four worker chest marks into data/locations-base.json.

  - title: "[SITE] Create shelter region marker"
    assignee: steward
    initial_status: todo
    after:
      - "[RECONCILE] Promote chest marks"
      - "[CONSTRUCT] Build 5x5 cobble shelter on the pad"
    body: |
      Anchor a `:shelter:` region around the genesis pad at ({anchor_x}, {anchor_y}, {anchor_z}) with `intent=marker` (ad-hoc place is allowed inside).

      Doctrine:

      1. **Move to the shelter center first.** `mc region_create` uses your current position as the anchor by default. Off-center placement has caused remove-and-recreate cycles in prior runs.
      2. **Create the region** with `mc region_create :shelter: base --r <radius> --y <pad_floor>..<above_roof> --intent marker --shape column`. Radius covers the 5×5 footprint plus a small apron; the y range spans pad floor (anchor y-1) up to a block clear of the roof (anchor y+3 or so).
      3. **Reload regions** so every bot's in-memory cache picks up the change: `mc regions_reload`.

      **Verify before complete:** `mc regions --at {anchor_x} {anchor_y} {anchor_z}` should list `:shelter:` with intent=marker. Quote that result in your complete summary.
