# Genesis benchmark supply targets (not production 512/768).
food:
  items: [bread, cooked_beef, cooked_chicken, cooked_porkchop, cooked_mutton, cooked_rabbit, baked_potato, apple, golden_apple, melon_slice]
  # Lowered from 64: 64 prepared-food items is unrealistic for an early colony with
  # no cooking pipeline — it dead-locked the food gate while bots starved. 16 is an
  # achievable early benchmark (the render seeds a lean STARTER_FOOD_COUNT=8 pantry;
  # a first wheat/cook harvest closes the rest). Raise once a real food loop exists.
  target_min: 16
  target_ok: 24
  assignee: flint

wood:
  items: [oak_log, birch_log, spruce_log, jungle_log, acacia_log, dark_oak_log, mangrove_log, cherry_log]
  target_min: 128
  target_ok: 192
  assignee: flint

stone:
  items: [cobblestone, stone]
  target_min: 128
  target_ok: 192
  assignee: flint

coal:
  items: [coal, charcoal]
  target_min: 64
  target_ok: 128
  assignee: flint
