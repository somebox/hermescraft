# D1 — mixed 32x32 perception scene for perception-digest MVP.
# Tester at (0, 65, 0) facing south after prep. World: landfolk-test.

world: landfolk-test

prep:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -16 65 -16 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -16 64 -16 15 64 15 minecraft:grass_block"
  # dirt / coarse_dirt patches (noise)
  - "execute in landfolk-test run fill 4 64 4 7 64 7 minecraft:dirt"
  - "execute in landfolk-test run setblock -12 64 10 minecraft:coarse_dirt"
  - "execute in landfolk-test run setblock -11 64 11 minecraft:coarse_dirt"
  # sand patch 3x3
  - "execute in landfolk-test run fill 14 64 14 16 64 16 minecraft:sand"
  # water pond (below floor rim)
  - "execute in landfolk-test run fill -8 63 8 -5 63 10 minecraft:water"
  - "execute in landfolk-test run fill -8 64 8 -5 64 10 minecraft:water"
  # oak tree 1 — trunk at (8, 65..68, -6), leaves at y=69
  - "execute in landfolk-test run setblock 8 65 -6 minecraft:oak_log"
  - "execute in landfolk-test run setblock 8 66 -6 minecraft:oak_log"
  - "execute in landfolk-test run setblock 8 67 -6 minecraft:oak_log"
  - "execute in landfolk-test run setblock 8 68 -6 minecraft:oak_log"
  - "execute in landfolk-test run fill 7 69 -7 9 69 -5 minecraft:oak_leaves"
  # oak tree 2 — (-10, 65..68, 4)
  - "execute in landfolk-test run setblock -10 65 4 minecraft:oak_log"
  - "execute in landfolk-test run setblock -10 66 4 minecraft:oak_log"
  - "execute in landfolk-test run setblock -10 67 4 minecraft:oak_log"
  - "execute in landfolk-test run setblock -10 68 4 minecraft:oak_log"
  - "execute in landfolk-test run fill -11 69 3 -9 69 5 minecraft:oak_leaves"
  # birch decoy — (-4, 65..67, -12)
  - "execute in landfolk-test run setblock -4 65 -12 minecraft:birch_log"
  - "execute in landfolk-test run setblock -4 66 -12 minecraft:birch_log"
  - "execute in landfolk-test run setblock -4 67 -12 minecraft:birch_log"
  - "execute in landfolk-test run fill -5 68 -13 -3 68 -11 minecraft:birch_leaves"
  # cobble outcrop 2x2
  - "execute in landfolk-test run setblock 12 65 12 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 13 65 12 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 12 65 13 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 13 65 13 minecraft:cobblestone"
  # pumpkins (noise)
  - "execute in landfolk-test run setblock -6 65 -4 minecraft:pumpkin"
  - "execute in landfolk-test run setblock 5 65 -8 minecraft:pumpkin"
  # flowers (noise)
  - "execute in landfolk-test run setblock 2 65 8 minecraft:poppy"
  - "execute in landfolk-test run setblock -2 65 9 minecraft:dandelion"
  - "execute in landfolk-test run setblock 10 65 -2 minecraft:oxeye_daisy"
  - "execute in landfolk-test run setblock -8 65 -3 minecraft:cornflower"
  - "execute in landfolk-test run setblock 3 65 -10 minecraft:azure_bluet"
  - "execute in landfolk-test run setblock -14 65 0 minecraft:allium"
  # short_grass — cluster in front of bot (seeds intent)
  - "execute in landfolk-test run setblock 2 65 3 minecraft:short_grass"
  - "execute in landfolk-test run setblock 3 65 4 minecraft:short_grass"
  - "execute in landfolk-test run setblock 4 65 5 minecraft:short_grass"
  - "execute in landfolk-test run setblock 5 65 4 minecraft:short_grass"
  - "execute in landfolk-test run setblock 6 65 3 minecraft:short_grass"
  - "execute in landfolk-test run setblock 1 65 5 minecraft:short_grass"
  # short_grass — scattered elsewhere
  - "execute in landfolk-test run setblock -7 65 6 minecraft:short_grass"
  - "execute in landfolk-test run setblock 11 65 -4 minecraft:short_grass"
  - "execute in landfolk-test run setblock -13 65 -8 minecraft:short_grass"
  - "execute in landfolk-test run setblock 9 65 10 minecraft:short_grass"
  - "execute in landfolk-test run setblock -5 65 14 minecraft:short_grass"
  - "execute in landfolk-test run setblock 15 65 -10 minecraft:short_grass"
  # tall_grass cluster
  - "execute in landfolk-test run setblock -3 65 7 minecraft:tall_grass"
  - "execute in landfolk-test run setblock -3 66 7 minecraft:tall_grass"
  - "execute in landfolk-test run setblock 7 65 2 minecraft:tall_grass"
  - "execute in landfolk-test run setblock 7 66 2 minecraft:tall_grass"
  # sugar cane near pond
  - "execute in landfolk-test run setblock -6 65 9 minecraft:sugar_cane"
  - "execute in landfolk-test run setblock -6 66 9 minecraft:sugar_cane"
  # cow (NoAI)
  - "execute in landfolk-test run summon minecraft:cow 6 65 -3 {NoAI:1b,PersistenceRequired:1b}"
  - "mvtp Tester landfolk-test"
  - "execute in landfolk-test run tp Tester 0 65 0 0 0"
  - "effect clear Tester"
  - "effect give Tester minecraft:saturation 600 1"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -20 64 -20 20 80 20 minecraft:air"
  - "execute in landfolk-test run fill -20 64 -20 20 64 20 minecraft:grass_block"
