# Phase E [MAP:ARENA] epic. Single root card seeds via
# establish-mapping-cards.yaml; Steward grows the graph from there.
title: "[EPIC] [MAP:ARENA] Map this disc — torch-lit paths between named places"
assignee: steward
initial_status: ready
body: |
  Epic: map this {arena_radius}-block proc-lab disc with torch-lit paths between named places.

  Spawn: {spawn_x},{spawn_y},{spawn_z}
  Muster: {muster_x},{muster_y},{muster_z}
  Starter chest: {chest_x},{chest_y},{chest_z}
  Arena radius: {arena_radius} blocks

  Tag: `[MAP:ARENA]` (Steward detects this token in title).

  Mission model:
  - Worker card format: `[MAP-PATH] <startName> -> (target coord)`
  - Node: named POI (`sign_at`)
  - Edge: torch waypoint chain (`torch_at`, adjacency <= 30 blocks)
  - Steward expands from named frontier nodes (graph degree <= 1)

  Steward cycle checklist:
  1. `scripts/poi-graph.py --pretty`
  2. If graph looks stale or missing worker updates: `scripts/reconcile-pois.py --auto`
  3. Select frontier node + target 40-60 blocks into less-covered terrain
  4. Create max one `[MAP-PATH]` card per assignable worker
  5. Process all new `SIGN_PROPOSAL` comments with `APPROVED` / `REJECTED` / `SUGGEST`
  6. Do not copy stale instructions from old cards (re-read current protocol each cycle)

  Worker checklist (card body must enforce):

  - Start from `mc go_poi <start>` (or explicit start coord in card)
  - Every ~25 blocks: `mc reachable` -> clear blocker -> `mc place_torch` -> `mc poi_add wp_* --torch`
  - At target: `mc nearby_signs 32` -> `SIGN_PROPOSAL` comment -> wait <=90s -> place sign -> `mc poi_add --sign`
  - Return via torch trail
  - Completion body includes literal output of `mc marks`, `mc pois`, `mc nearby_signs 32`

  Done when:

  - `named_count ≥ {poi_target}` landmark POIs in `personal-pois-shared.json`
  - `longest_path_len ≥ {coverage_min}` blocks (the map's spine)
  - `quadrants_covered` includes all 4 of NE/NW/SE/SW across the graph
  - `named_frontier_count ≤ 3` (most landmarks are connected, not isolated)
  - Steward chats `coverage sufficient — wrap up` and closes this epic

  Vocabulary:

   - **Personal POI** (per-bot, then reconciled): `mc poi_add`, `mc pois`,
     `mc go_poi`. Free-form creative names.
   - **Fleet mark** (shared, prefixed): `mc mark lt_*` / `chest_*` / `base_*`.
     **Reserved for the establish mission; do NOT use for mapping POIs.**
