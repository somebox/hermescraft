# Phase E mapping seed: a single root card. Steward grows the graph from
# here by picking frontier nodes and generating [MAP-PATH] cards each
# cycle. No quadrant-patrol scaffolding — paths emerge organically.
cards:
  - title: "[MAP-PATH] muster → first landmark"
    skills: [minecraft-navigation, minecraft-mapping]
    body: |
      World: proc-lab. Hub: muster ({muster_x},{muster_y},{muster_z}).
      Goal: create the first graph edge and first non-muster landmark.

      Execute this checklist in order:

      1. Register root node:
         `mc poi_add muster --sign {muster_x} {muster_y} {muster_z} --kind hub`
      2. Place root sign exactly as:
         `mc place_named_sign {muster_x} {muster_y} {muster_z} "muster"`
      3. Pick one bearing (N/E/S/W) and keep it for this card.
      4. Move outward 40-50 blocks from muster.
      5. Every ~25 blocks, run:
         - `mc reachable` (next 5 cells)
         - clear blocker (`mc dig` lip or `mc build_stairs cobblestone <dir> 4`)
         - `mc place_torch X Y Z`
         - `mc poi_add wp_<dir>_<n> --torch X Y Z --kind waypoint`
      6. At endpoint, run `mc nearby_signs 32`.
      7. Comment exactly:
         `SIGN_PROPOSAL: name='<name>', coord=(X,Y,Z), kind=landmark, note='<terrain>'`
      8. Wait up to 90s (`mc read_chat` + `kanban_show`):
         - if Steward approved/suggested a name, use that name
         - if no response, use your proposed name
      9. Place and register landmark:
         - `mc place_named_sign X Y Z "<name>"`
         - `mc poi_add <name> --sign X Y Z --kind landmark`
      10. Return to muster via your torch waypoints.

      Completion body MUST include literal output of:
      - `mc marks`
      - `mc pois`
      - `mc nearby_signs 32`

      Hard constraints:
      - Do not place sign on your standing cell (offset 1-2 blocks).
      - Sign text lines must be <=15 chars.
      - Do not skip `poi_add` for root, waypoints, or landmark.
      - Do not leave an unreturnable torch trail.
