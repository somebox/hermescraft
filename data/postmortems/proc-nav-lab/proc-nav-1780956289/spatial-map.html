<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>proc-nav spatial map</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; }
  canvas { border: 1px solid #ccc; max-width: 100%; }
</style></head><body>
<h1>proc-nav spatial map</h1>
<p>Schematic XZ — anchors (blue), path (green), marks (orange).</p>
<canvas id="c" width="640" height="640"></canvas>
<script>
const DATA = {"anchors": [{"name": "spawn", "x": -25, "z": 28, "y": 90}, {"name": "muster", "x": -19, "z": 28, "y": 90}, {"name": "overlook", "x": 0, "z": 0, "y": 96}, {"name": "return_post", "x": 0, "z": 6, "y": 96}], "marks": [{"name": "death_4", "x": 2.3, "z": 3.3, "y": 65.0}, {"name": "death_5", "x": 1.2, "z": 1.2, "y": 60.0}, {"name": "wheat_plot", "x": -50.0, "z": 50.0, "y": 64.0}, {"name": "wheat_chest", "x": -50.0, "z": 60.0, "y": 65.0}, {"name": "wheat_start", "x": -55.0, "z": 50.0, "y": 65.0}, {"name": "spawn", "x": -25.0, "z": 28.0, "y": 90.0}, {"name": "muster", "x": -19.0, "z": 28.0, "y": 90.0}, {"name": "overlook", "x": 0.0, "z": 0.0, "y": 96.0}, {"name": "return_post", "x": 0.0, "z": 6.0, "y": 96.0}, {"name": "mine_entrance", "x": -24.0, "z": 29.0, "y": 89.0}, {"name": "tunnel_start", "x": -24.0, "z": 30.0, "y": 89.0}], "path": [{"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 28.5}, {"x": -24.5, "z": 30.7}, {"x": -27.5, "z": 34.3}, {"x": -20.7, "z": 40.0}, {"x": -15.5, "z": 30.7}, {"x": -4.5, "z": 10.6}, {"x": -0.5, "z": 1.5}, {"x": -0.5, "z": 1.5}, {"x": 2.6, "z": 4.4}, {"x": 1.5, "z": 0.7}, {"x": 1.5, "z": 0.7}, {"x": 1.5, "z": 0.7}, {"x": 0.6, "z": 0.5}, {"x": 1.4, "z": 0.5}, {"x": 0.6, "z": 0.5}, {"x": 0.6, "z": 0.5}, {"x": 0.4, "z": 0.5}, {"x": 0.4, "z": 0.5}, {"x": 0.4, "z": 0.5}, {"x": 1.5, "z": 0.5}, {"x": 1.5, "z": 0.4}, {"x": 3.5, "z": -0.5}, {"x": 0.5, "z": -0.5}, {"x": 0.5, "z": -0.5}, {"x": 0.5, "z": -0.5}, {"x": 0.5, "z": -0.5}, {"x": 0.5, "z": -0.5}, {"x": 2.5, "z": -6.5}, {"x": 4.5, "z": 9.3}, {"x": 4.5, "z": 6.5}, {"x": 4.5, "z": 6.5}, {"x": 4.5, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}, {"x": 0.6, "z": 6.5}]};
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const allX = [...DATA.anchors.map(a=>a.x), ...DATA.path.map(p=>p.x), ...DATA.marks.map(m=>m.x)];
const allZ = [...DATA.anchors.map(a=>a.z), ...DATA.path.map(p=>p.z), ...DATA.marks.map(m=>m.z)];
if (!allX.length) {
  ctx.fillText('No spatial data', 20, 40);
} else {
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minZ = Math.min(...allZ), maxZ = Math.max(...allZ);
  const pad = 24;
  const sx = (canvas.width - 2*pad) / Math.max(1, maxX - minX);
  const sz = (canvas.height - 2*pad) / Math.max(1, maxZ - minZ);
  function tx(x) { return pad + (x - minX) * sx; }
  function tz(z) { return pad + (z - minZ) * sz; }
  ctx.strokeStyle = '#2a2';
  ctx.beginPath();
  DATA.path.forEach((p,i) => {
    const x = tx(p.x), y = tz(p.z);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = '#06c';
  DATA.anchors.forEach(a => {
    ctx.beginPath();
    ctx.arc(tx(a.x), tz(a.z), 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillText(a.name, tx(a.x)+8, tz(a.z));
  });
  ctx.fillStyle = '#c60';
  DATA.marks.forEach(m => {
    ctx.beginPath();
    ctx.arc(tx(m.x), tz(m.z), 4, 0, Math.PI*2);
    ctx.fill();
  });
}
</script></body></html>
