# L3.69 — multi_zombie_survival: bot vs N zombies in a closed arena.
# Tunable. Set ZOMBIE_COUNT in the prep — start with 3, push toward 4.
#
# Setup:
#   Closed 9x9 stone arena (walls at x=±4 and z=±4, 3 high cobblestone).
#   Bot at (0, 65, 0) with wooden_sword, NO armor.
#   3 zombies summoned at points around the bot (sw, ne, se corners) —
#   reactive should pick the CLOSEST and engage.
#
# Goal: see if bot survives. With wooden sword (4 dmg/swing, ~2 swings/sec
#   of damage on cooldown) bot kills each zombie in ~3s. With saturation
#   regen ~1 HP/sec and zombies hitting ~2.5 dmg/attack, bot loses ~5 HP/s
#   while focused on one with 2 still hitting. Expected to survive 3 zombies
#   most of the time; 4 is borderline.
#
# Validates:
#   - reactive picks closest hostile each tick
#   - target switching after a kill works
#   - anchor stays bounded even with multiple threats

world: landfolk-test

prep:
  - "execute in landfolk-test run difficulty easy"
  - "execute in landfolk-test run time set night"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule mobGriefing false"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  # 9x9 arena
  - "execute in landfolk-test run fill -4 65 -4 4 67 -4 minecraft:cobblestone"
  - "execute in landfolk-test run fill -4 65 4 4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run fill -4 65 -4 -4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run fill 4 65 -4 4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock -3 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock 3 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock -3 66 3 minecraft:torch"
  - "execute in landfolk-test run setblock 3 66 3 minecraft:torch"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "execute in landfolk-test run effect clear Flint"
  - "execute in landfolk-test run effect give Flint minecraft:instant_health 1 5 true"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"
  - "give Flint minecraft:wooden_sword 1"
  # 3 zombies — N, SW, SE corners, ~3 blocks from bot
  - 'execute in landfolk-test run summon minecraft:zombie 0 65 -3 {PersistenceRequired:1b,Tags:["target","z1"]}'
  - 'execute in landfolk-test run summon minecraft:zombie -3 65 2 {PersistenceRequired:1b,Tags:["target","z2"]}'
  - 'execute in landfolk-test run summon minecraft:zombie 3 65 2 {PersistenceRequired:1b,Tags:["target","z3"]}'

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle true"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
