# L3.16 — craft_wood_agnostic: chest accepts any planks (birch works).
#
# Mirror of L3.15: chest recipe is wood-type-agnostic — any planks work.
# Bot with birch_planks + crafting_table should succeed where oak_door failed.
#
# Setup: 8 birch_planks; crafting_table at (2, 65, 0).
# Expected:
#   ok=true, data.crafted_count==1,
#   data.ingredients_consumed has birch_planks: 8 (NOT oak_planks),
#   data.ended_inventory.chest >= 1.
#
# Together L3.15 + L3.16 lock the wood-type semantics: recipes that NAME
# a specific wood (doors, fences, signs) require that wood; recipes that
# accept #planks tag (chest, crafting_table, sticks) accept any wood.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:crafting_table"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "give Flint minecraft:birch_planks 8"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 2 65 0 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "mvtp Flint world"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
