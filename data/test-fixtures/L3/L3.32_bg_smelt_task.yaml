# L3.32 — bg_smelt_task: smelt as a background task (the canonical pattern).
#
# Purpose: lock the background-task semantics of smelt. The synchronous
# /action/smelt blocks the request handler for ~12s per item, which is
# wrong for any agent that needs to do other things during smelt. The
# correct pattern is POST /task/smelt — returns immediately with a
# task_id, and the agent polls /task or pull events until status=done.
#
# This test does NOT use the synchronous endpoint. It validates that:
#   1. POST /task/smelt returns ok=true immediately (<1s) with task_id.
#   2. /task initially shows status=running.
#   3. After enough time, /task shows status=done with the smelt result.
#   4. The inventory has the smelted output.
#
# Setup: same as L3.30 — raw_iron + coal + furnace at (2, 65, 0).

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:furnace"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "give Flint minecraft:raw_iron 1"
  - "give Flint minecraft:coal 1"
  - "effect give Flint minecraft:saturation 1 30"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 2 65 0 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
