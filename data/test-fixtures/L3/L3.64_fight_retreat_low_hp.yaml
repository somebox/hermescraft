# L3.64 — fight_retreat_low_hp: bot fights but retreats when HP drops low.
#
# Setup:
#   landfolk-test EASY. Bot at (0, 65, 0), wooden_sword, NO armor (so it
#   takes meaningful damage). Bot pre-damaged to ~14 HP via /damage so the
#   retreat threshold (default 6, we'll bump to 12 for the test) triggers
#   after 1-2 hits.
#   Zombie at (2, 65, 0) — point-blank.
#
# Action: mc fight zombie 15 30
#   (target=zombie, retreat_health=15, duration=30s)
# Expected: bot fights briefly, takes damage, drops below 12 HP, retreats
#   (pathfinder.goto away from zombie). Result message: "Retreated from zombie".
#   Bot ALIVE at end (HP > 0 even if low).
#
# This exercises the defensive-movement branch of the fight loop.

world: landfolk-test

prep:
  - "execute in landfolk-test run difficulty easy"
  - "execute in landfolk-test run time set night"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run fill -5 65 -5 15 80 5 minecraft:air"
  - "execute in landfolk-test run fill -10 50 -10 15 64 10 minecraft:stone"
  - "execute in landfolk-test run kill @e[type=!player]"
  # Torches for nighttime visibility
  - "execute in landfolk-test run setblock -3 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock 6 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock -3 66 3 minecraft:torch"
  - "execute in landfolk-test run setblock 6 66 3 minecraft:torch"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0"
  - "clear Flint"
  - "give Flint minecraft:wooden_sword 1"
  - "effect give Flint minecraft:saturation 600 1"
  # No instant_health — so retreat threshold actually triggers when HP drops
  # damage Flint down to ~12 HP so the retreat threshold (15) triggers immediately
  - "execute in landfolk-test run damage Flint 8 generic"
  - 'execute in landfolk-test run summon minecraft:zombie 2 65 0 {PersistenceRequired:1b,Tags:["target"]}'

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle true"
  - "execute in landfolk-test run fill -5 65 -5 15 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
