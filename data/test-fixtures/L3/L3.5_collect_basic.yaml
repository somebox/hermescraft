# L3.5 — collect_basic: mc collect 3 oak_log within 5 blocks → mined_count=3.
#
# Purpose: verify the collect contract success path and the data envelope
# (mined_count, requested_count, started_inventory, ended_inventory,
# dropped_items_collected).
# Reference: bot/lib/actions/mining.js collect() — Phase-2 contract.
#
# Region: spawn platform with 3 oak_log placed in a row at (2..4, 65, 0).
# Each is reachable bare-hand (logs harvest fast on bare hand in fair-play).
#
# Bot setup: bare hand, on platform, full HP/food.
# Expected response:
#   ok=true,
#   data.mined_count == 3,
#   data.requested_count == 3,
#   data.partial_failure == false,
#   data.dropped_items_collected >= 1 (drops typically self-pickup nearby).

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:oak_log"
  - "execute in landfolk-test run setblock 4 65 0 minecraft:oak_log"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:air"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "execute in landfolk-test run setblock 4 65 0 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
