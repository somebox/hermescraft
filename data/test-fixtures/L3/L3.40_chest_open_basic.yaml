# L3.40 — chest_open_basic: open a populated chest, list contents.
#
# Setup: chest at (2, 65, 0) with 8 oak_planks + 4 cobblestone (NBT-loaded
# in prep). Bot has empty inventory.
# Action: POST /action/list_container {x:2,y:65,z:0}
# Expected:
#   ok=true,
#   data.container_kind == 'chest',
#   data.position == {x:2,y:65,z:0},
#   data.item_counts == {oak_planks:8, cobblestone:4},
#   data.slots has 2 entries.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - 'execute in landfolk-test run setblock 2 65 0 minecraft:chest{Items:[{Slot:0b,id:"minecraft:oak_planks",count:8},{Slot:1b,id:"minecraft:cobblestone",count:4}]}'
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 2 65 0 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
