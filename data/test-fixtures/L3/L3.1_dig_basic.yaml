# L3.1 — dig_basic: mc dig succeeds on a dirt block adjacent to bot
#
# Purpose: verify the dig action contract holds for the simplest case.
# Reference: docs/design/phase-2/action-contracts.md (mc dig contract) and docs/design/phase-2/sprints.md Sprint 3.
#
# Region: (0, 65, 0) — spawn platform. Dirt is placed at (1, 65, 0).
#
# Bot setup: bare hand, on spawn platform, full HP/food.
# Expected response per action contract:
#   ok=true, data.block_name=="dirt", inventory contains dirt x1.

world: landfolk-test

prep:
  # Clear region above platform of any prior fixture artifacts
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  # Place the test block adjacent to spawn (at platform level, walkable height for bot)
  - "execute in landfolk-test run setblock 1 65 0 minecraft:dirt"
  # Bot starting state — tp at Y=72 to let chunk load before bot reaches the platform
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  # Restore region; return bot
  - "execute in landfolk-test run fill -2 66 -2 2 80 2 minecraft:air"
  - "execute in landfolk-test run setblock 1 65 0 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
