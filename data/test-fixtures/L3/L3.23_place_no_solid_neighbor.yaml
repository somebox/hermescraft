# L3.23 — place_no_solid_neighbor: mc place returns NO_SOLID_NEIGHBOR
# when the target cell has 6 air faces (floating-in-space placement).
#
# Setup: target (3, 67, 0) — 2 blocks above platform top, no nearby blocks.
# Distance from bot at (0.5, 65, 0.5) is sqrt(2.5²+2²+0.5²) = 3.24 (within 4.5,
# so no pathfind required → reaches the NO_SOLID_NEIGHBOR check).
# Bot has cobblestone but the target has no surface to attach to.
# Action: POST /action/place {block:"cobblestone", x:3, y:67, z:0}
# Expected:
#   ok=false,
#   error.code=="NO_SOLID_NEIGHBOR",
#   error.observed_state.neighbors lists all 6 faces with is_air=true.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  # Ensure no blocks anywhere around the target (3, 67, 0)
  - "execute in landfolk-test run fill 2 66 -1 4 68 1 minecraft:air"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "give Flint minecraft:cobblestone 4"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill 2 66 -1 4 68 1 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
