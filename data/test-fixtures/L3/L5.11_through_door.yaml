# L5.11 — through_door: enter and exit a 3x3 house through an oak_door.
#
# Validates that mc through works with 2-block tall doors (not just gates),
# and that the bot can reach a small interior + come back out.
#
# Setup:
#   landfolk-test, day, cleared 21x21 arena.
#   Stone floor at y=64. 5x5 cobblestone-walled house with 3x3 interior:
#   walls at x=-2, x=2, z=0, z=4 (y=65..66); interior at x∈[-1,1], z∈[1,3].
#   South wall at z=4 has an oak_door centered at (0, 65..66, 4).
#   Bot at (0, 65, 7) — south of the house, facing the door.
#
# Actions under test:
#   1. mc through 0 65 4 0 65 2      # enter (walk to interior center)
#   2. mc through 0 65 4 0 65 6      # exit (walk back outside)
#
# Expected per call:
#   - { ok: true, data: { gate_block: "oak_door", opened, traversed_to,
#       closed: true } }
#   - After call 1: bot inside (z ≈ 1..3), door closed.
#   - After call 2: bot outside (z ≈ 5..7), door closed.

world: landfolk-test

prep:
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule doMobSpawning false"
  - "execute in landfolk-test run time set day"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  # 5x5 house: walls at y=65..66 around x∈[-2,2], z∈[0,4]
  # North wall (z=0):
  - "execute in landfolk-test run fill -2 65 0 2 66 0 minecraft:cobblestone"
  # West wall (x=-2):
  - "execute in landfolk-test run fill -2 65 1 -2 66 4 minecraft:cobblestone"
  # East wall (x=2):
  - "execute in landfolk-test run fill 2 65 1 2 66 4 minecraft:cobblestone"
  # South wall corners (door fills middle):
  - "execute in landfolk-test run setblock -2 65 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock -2 66 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock -1 65 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock -1 66 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 1 65 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 1 66 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 2 65 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 2 66 4 minecraft:cobblestone"
  # Door in south wall middle, facing south (open swings outward to z>4):
  - "execute in landfolk-test run setblock 0 65 4 minecraft:oak_door[half=lower,facing=south,hinge=left,open=false]"
  - "execute in landfolk-test run setblock 0 66 4 minecraft:oak_door[half=upper,facing=south,hinge=left,open=false]"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 7"
  - "effect clear Flint"
  - "effect give Flint minecraft:saturation 600 1"
  - "clear Flint"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
