# L3.71 — multi_zombie_four: 4 zombies in closed arena, cardinal pattern.
# Stress test for multi-target reactive + lateral strafe + wall-aware
# retreat.
#
# Setup: 9x9 arena. 4 zombies surrounding the bot at cardinal directions
# (N/E/S/W) at radius 3.
#
# History:
#   F39 (multi-target attackStep) — bot survived 4 zombies at full HP.
#   F42 (lateral strafe + stuck escalation, 2026-05-10) — original 6-zombie
#     version cleared reliably with mid-test death.
#   2026-05 (this refactor) — tuned down 6 → 4 to match the reactive
#     layer's default skill 0.5. The 6-zombie pile-on relied on the bot
#     dying once and mopping up the persistent zombies; that was brittle
#     to evolution in the reactive policy. Four cardinals reliably clear
#     at full HP and validate the same multi-slash + strafe behaviors.

world: landfolk-test

prep:
  - "execute in landfolk-test run difficulty easy"
  - "execute in landfolk-test run time set night"
  - "execute in landfolk-test run gamerule doDaylightCycle false"
  - "execute in landfolk-test run gamerule mobGriefing false"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run fill -10 64 -10 10 64 10 minecraft:stone"
  - "execute in landfolk-test run fill -4 65 -4 4 67 -4 minecraft:cobblestone"
  - "execute in landfolk-test run fill -4 65 4 4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run fill -4 65 -4 -4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run fill 4 65 -4 4 67 4 minecraft:cobblestone"
  - "execute in landfolk-test run setblock -3 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock 3 66 -3 minecraft:torch"
  - "execute in landfolk-test run setblock -3 66 3 minecraft:torch"
  - "execute in landfolk-test run setblock 3 66 3 minecraft:torch"
  - "execute in landfolk-test run tp Tester 0 65 0"
  - "execute in landfolk-test run effect clear Tester"
  - "execute in landfolk-test run effect give Tester minecraft:instant_health 1 5 true"
  - "effect give Tester minecraft:saturation 600 1"
  - "clear Tester"
  - "give Tester minecraft:wooden_sword 1"
  # 4 zombies — N/E/S/W cardinals at radius 3. Tuned down from 6 (hex) so the
  # bot doesn't get instakilled at the start by the pile-on; the multi-target
  # slash + lateral strafe keep it intact through clear.
  - 'execute in landfolk-test run summon minecraft:zombie 0 65 -3 {PersistenceRequired:1b,Tags:["target"]}'
  - 'execute in landfolk-test run summon minecraft:zombie 3 65 0 {PersistenceRequired:1b,Tags:["target"]}'
  - 'execute in landfolk-test run summon minecraft:zombie 0 65 3 {PersistenceRequired:1b,Tags:["target"]}'
  - 'execute in landfolk-test run summon minecraft:zombie -3 65 0 {PersistenceRequired:1b,Tags:["target"]}'

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run difficulty peaceful"
  - "execute in landfolk-test run gamerule doDaylightCycle true"
  - "execute in landfolk-test run fill -10 65 -10 10 80 10 minecraft:air"
  - "execute in landfolk-test run tp Tester 52 65 52"
