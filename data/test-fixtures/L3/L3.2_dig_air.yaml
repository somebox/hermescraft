# L3.2 — dig_air: mc dig at an air block returns NO_BLOCK_AT_COORD.
#
# Purpose: verify the dig action contract's NO_BLOCK_AT_COORD path.
# Reference: bot/lib/actions/mining.js dig() — first guard block.
#
# Bot setup: bare hand, on spawn platform, full HP/food.
# Target: (1, 70, 0) — definitely air; 5 blocks above the platform.
# Expected response:
#   ok=false, error.code="NO_BLOCK_AT_COORD",
#   error.observed_state.block_at_target=="air".

world: landfolk-test

prep:
  # Region clear (also clears the target coord — must be air for the test).
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  # Bot on platform with chunk-load slow_falling
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
