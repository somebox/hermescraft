# L3.20 — place_basic: mc place succeeds when item in inventory, target empty,
# and a solid neighbor face is available.
#
# Setup: bot on platform with cobblestone in inventory.
#   Target: (3, 65, 0) — currently air, with platform stone at (3, 64, 0)
#   directly below as the solid neighbor face.
# Action: POST /action/place {block:"cobblestone", x:3, y:65, z:0}
# Expected: ok=true, data.placed_block=="cobblestone",
#           data.face_used.dx==0,dy==-1,dz==0 (placed on top of platform stone),
#           server-side block at (3,65,0) is cobblestone after.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  # Ensure target cell is air (it already is from fill, but explicit):
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "give Flint minecraft:cobblestone 4"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "mvtp Flint world"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
