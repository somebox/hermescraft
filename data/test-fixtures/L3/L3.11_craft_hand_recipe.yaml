# L3.11 — craft_hand_recipe: mc craft sticks from oak_planks (no table needed).
#
# Sticks recipe: 2 planks (any wood type) → 4 sticks. Hand-craftable
# (recipe.requiresTable === false), so the bot needs no crafting_table nearby.
#
# Setup: bot has 4 oak_planks in inventory. Request craft sticks count=1.
# Expected:
#   ok=true,
#   data.crafted_count == 4 (1 craft × 4 per result),
#   data.requested_count == 1,
#   data.recipe_used.requires_table == false,
#   data.ingredients_consumed has oak_planks: 2,
#   data.ended_inventory.stick == 4.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "give Flint minecraft:oak_planks 4"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
