# L9.4 — shear_basic: unsheared sheep in front + shears in inv → wool gained.
#
# Action: POST /action/shear
# Expected: ok=true, data.wool_gained>=1.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run fill -5 64 -5 5 64 5 minecraft:grass_block"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0 0 0"
  - "execute in landfolk-test run summon minecraft:sheep 0 65 3 {NoAI:1b,Color:0b,Sheared:0b}"
  - "clear Flint"
  - "give Flint minecraft:shears 1"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -5 64 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run fill -5 64 -5 5 64 5 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
