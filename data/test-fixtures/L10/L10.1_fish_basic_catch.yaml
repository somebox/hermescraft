# L10.1 — fish_basic_catch: bot at pond edge with rod → catches something.
#
# Setup: 7x7 pond at z>=3, bot at (0,65,0) holding fishing_rod.
# Action: POST /action/fish {timeout_seconds: 90}
# Expected: ok=true, data.caught has at least one item (fish/junk/treasure).

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -15 65 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:grass_block"
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -3 64 3 3 64 9 minecraft:water"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 65 0 0 0"
  - "clear Flint"
  - "give Flint minecraft:fishing_rod 1"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"

cleanup:
  - "execute in landfolk-test run kill @e[type=!player]"
  - "execute in landfolk-test run fill -15 64 -15 15 80 15 minecraft:air"
  - "execute in landfolk-test run fill -15 64 -15 15 64 15 minecraft:stone"
  - "execute in landfolk-test run tp Flint 52 65 52"
