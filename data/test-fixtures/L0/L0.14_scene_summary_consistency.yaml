# L0.14 — scene_summary_consistency: visible_blocks summary names appear in visible_block_hits.
#
# Purpose: scene returns BOTH a per-block-type summary (visible_blocks) and a
# per-coord hit list (visible_block_hits). They should be internally
# consistent: every name in visible_blocks must also appear at least once in
# visible_block_hits (otherwise the summary is reporting blocks that weren't
# actually raycast-hit).
#
# Setup: a few different placed blocks within FOV.
#   cobblestone at (3, 65, 0)
#   oak_log     at (4, 65, -1)
#   oak_planks  at (4, 65, 1)
# Action:
#   POST /action/look {x:10,y:65,z:0}
#   GET /scene?range=12
# Expected:
#   set(name for n in visible_blocks)  ⊆  set(h.name for h in visible_block_hits)

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 8 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 4 65 -1 minecraft:oak_log"
  - "execute in landfolk-test run setblock 4 65 1 minecraft:oak_planks"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "execute in landfolk-test run setblock 4 65 -1 minecraft:air"
  - "execute in landfolk-test run setblock 4 65 1 minecraft:air"
  - "execute in landfolk-test run fill -5 65 -5 8 80 5 minecraft:air"
  - "mvtp Flint world"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
