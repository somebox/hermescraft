# L0.11 — discover_distant: mc discover finds blocks beyond raycast range.
#
# Purpose: validate the chunk-scan path (b.findBlocks, no LoS required).
# Workers should be able to call `mc discover coal radius=64` and find ore
# in loaded chunks even with no line-of-sight.
#
# Setup:
#   bot at (0.5, 65, 0.5).
#   coal_ore at (40, 50, 0) — 40 blocks east, 15 blocks below platform.
#   This is well outside scene's 16-block raycast range AND below the bot.
# Action: POST /action/discover {category:"coal", radius:64}
# Expected:
#   ok=true,
#   discover.blocks contains entry with name=="coal_ore" and at least one
#   location, distance ~40-45.

world: landfolk-test

prep:
  # Force-load an extra chunk at (40, 0, 0) so the ore is in a loaded chunk.
  - "execute in landfolk-test run forceload add 32 -16 47 16"
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 40 50 0 minecraft:coal_ore"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run setblock 40 50 0 minecraft:stone"
  - "execute in landfolk-test run forceload remove 32 -16 47 16"
  - "mvtp Flint world"
  - "execute in landfolk-test run kill @e[type=item,distance=..50]"
