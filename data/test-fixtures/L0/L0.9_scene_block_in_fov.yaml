# L0.9 — scene_block_in_fov: mc scene reports a block in the bot's FOV cone.
#
# Purpose: lock the basic scene/raycast positive case. With the bot facing
# east, a placed block 3 blocks east MUST appear in scene's visible_blocks.
#
# Setup: bot at (0.5, 65, 0.5); cobblestone at (3, 65, 0); bot looking east.
# Action: POST /action/look {x:5, y:65, z:0} to face the block, then GET /scene.
# Expected: data.visible_blocks contains an entry name=="cobblestone".

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:cobblestone"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0 0 0"     # facing south (default), pitch 0, yaw 0
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
