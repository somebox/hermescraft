# L0.7 — nearby_close_block: mc nearby reports a block placed 1 step away.
#
# Purpose: lock the floor on close-range block visibility. If /nearby
# can't see a block 1 block away, every higher-level "find the chest"
# behavior breaks.
#
# Setup: bot at (0.5, 65, 0.5); stone at (1, 65, 0) — directly east, 1 block.
# Action: GET /nearby?radius=8
# Expected: data.blocks contains an entry where name=="stone".
#
# Note on the nearby block-scan: bot/lib/bot/observation.js:516 EXCLUDES
# stone/dirt/grass_block/deepslate by name. So this test will FAIL if we
# use stone — and that's the point: it's meant to surface that filter.
# We use cobblestone instead — uncommon enough to not be excluded.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 1 65 0 minecraft:cobblestone"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 1 65 0 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
