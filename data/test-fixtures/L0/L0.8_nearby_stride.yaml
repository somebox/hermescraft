# L0.8 — nearby_stride: surface the stride-2 X/Z scan in /nearby.
#
# Purpose: bot/lib/bot/observation.js:512 iterates dx,-scanR..scanR step 2.
# A 1-block target at an ODD X coordinate (relative to bot) can be skipped
# entirely. This test deliberately places one cobble at an even offset and
# one at an odd offset — only the even one is found.
#
# Setup: bot at (0.5, 65, 0.5).
#   target_even: cobblestone at (2, 65, 0)  — dx=+1.5 → bot.offset(2, 0, 0) = (2.5, 65, 0.5) → blockAt(2, 65, 0). dx=2 in iter.
#   target_odd:  cobblestone at (3, 65, 0)  — dx=+2.5 → blockAt(3, 65, 0). dx=3 in iter — SKIPPED by step 2.
#
# Expected:
#   data.blocks contains cobblestone with count >= 1 (the even one).
#   The "odd" placement is detectable only via OTHER tools (scene, find_blocks).
#
# This is documented as F10 in the sprint log.

world: landfolk-test

prep:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:cobblestone"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:cobblestone"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  - "execute in landfolk-test run fill -5 65 -5 5 80 5 minecraft:air"
  - "execute in landfolk-test run setblock 2 65 0 minecraft:air"
  - "execute in landfolk-test run setblock 3 65 0 minecraft:air"
  - "mvtp Flint world"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
