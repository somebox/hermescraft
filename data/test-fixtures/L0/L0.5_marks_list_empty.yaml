# L0.5 — marks_list_empty: GET /marks with an empty marks file returns empty array.
#
# The locations module reads the file fresh on each /marks call (no caching),
# so we can swap the file content live without restarting the bot.
#
# Setup:
#   prep:    back up data/locations-flint.json, replace with `{}`
#   action:  GET /marks
#   cleanup: restore the original file
#
# Expected:
#   ok=true,
#   data.marks is an array of length 0.

world: landfolk-test

prep:
  # Back up the live marks file
  - "local: cp /Users/foz/hermescraft/data/locations-flint.json /tmp/locations-flint.bak"
  # Write an empty object
  - 'local: echo "{}" > /Users/foz/hermescraft/data/locations-flint.json'
  # Bring Flint to the platform for consistency (no actual world manipulation needed)
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "mvtp Flint landfolk-test"
  - "execute in landfolk-test run tp Flint 0 72 0"
  - "clear Flint"
  - "effect give Flint minecraft:saturation 1 10"
  - "effect give Flint minecraft:instant_health 1 10 true"
  - "effect give Flint minecraft:slow_falling 5 0 true"

cleanup:
  # Restore the marks file
  - "local: mv /tmp/locations-flint.bak /Users/foz/hermescraft/data/locations-flint.json"
  - "execute in landfolk-test run fill -5 65 -5 10 80 5 minecraft:air"
  - "execute in landfolk-test run tp Flint 52 65 52"
  - "execute in landfolk-test run kill @e[type=item,distance=..32]"
