# wheat_capstone — staging arena for the wheat-farm capstone trial
# (Session 5b of the colony validation plan).
#
# Places a clean, dirt-floored 16×16 pad at :field_south: with a
# central water source, leaving the 9×9 plant area ready for the
# capstone's @builder → @farmer → @crafter chain to:
#   1. Level any uneven blocks (no-op if pad is already flat)
#   2. Till the 9×9 dirt to farmland
#   3. Plant wheat across all 80 non-water cells
#   4. Deposit harvested wheat at :chest_food:
#
# The mark coords match the corner values hardcoded in
# `prototypes/agent-arch/capstone/wheat_graph.py`'s
# `acceptance_predicates`. If you change one, change both.
#
# Used by: prototypes/agent-arch/capstone/run_wheat_capstone.py
# (Session 5b deliverable — runner script, not yet built).
# Apply through scripts/reset-wheat-capstone.sh (Session 5b prep —
# not yet built either; for now use scripts/run-fixture.sh directly).
#
# Plan: reports/agent-arch/2026-06-06-colony-validation-plan.md
# § "Capstone — Wheat farm".

world: landfolk-test

prep:
  # ── World structure ────────────────────────────────────────────────
  # Forceload + clear the 16×16 region so the capstone runs from a
  # known-clean state. Coords chosen far from the two-bot demo's seed
  # area (300, 65, 300) to avoid trample.
  - "execute in landfolk-test run forceload add -60 40 -40 60"
  - "execute in landfolk-test run fill -55 65 45 -45 75 55 minecraft:air"

  # Floor stack identical pattern to the two-bot demo (bedrock cap
  # so accidental floor-digging can never reach the void):
  #   Y=64: dirt (so till → farmland works; agents see "dirt" and
  #         won't confuse it with cobble or stone)
  #   Y=63-60: 4 layers of stone (sacrificial buffer)
  #   Y=59: bedrock (indestructible cap)
  - "execute in landfolk-test run fill -55 59 45 -45 59 55 minecraft:bedrock"
  - "execute in landfolk-test run fill -55 60 45 -45 63 55 minecraft:stone"
  - "execute in landfolk-test run fill -55 64 45 -45 64 55 minecraft:dirt"

  # ── Water source at field center ────────────────────────────────
  # Replace the dirt at the field center (Y=64) with a water source
  # block. This is what gives the surrounding tilled cells hydration
  # — wheat won't grow without water within 4 cells of any tile.
  # Single cell at (-50, 64, 50).
  - "execute in landfolk-test run setblock -50 64 50 minecraft:water"

  # ── Storage chest south of the field ────────────────────────────
  # @crafter deposits harvested wheat here. Empty at start.
  - "execute in landfolk-test run setblock -50 65 60 minecraft:chest"

  # ── Bot bodies ──────────────────────────────────────────────────
  # Move Mox (the wheat capstone's single body per walkthrough) into
  # landfolk-test if not already, then tp to a working position just
  # west of the field. Clear inventory so the trial starts from a
  # known state.
  - "mvtp Mox landfolk-test"
  # Brief settle — mvtp causes a disconnect/reconnect window; a tp
  # fired during the gap silently misses.
  - "local: sleep 1"
  # tp target MUST be inside the staged floor footprint (x: -55..-45,
  # z: 45..55) or Mox falls through to the void. Use the west edge,
  # standing on the dirt at Y=64 (so Y=65 is the air above).
  - "execute in landfolk-test run tp Mox -55 65 50"
  - "clear Mox"
  - "effect give Mox minecraft:saturation 1 10"
  - "effect give Mox minecraft:instant_health 1 10 true"

  # ── Give Mox the tools the chain expects ────────────────────────
  # The capstone's @farmer card body assumes the bot already has a
  # hoe + wheat seeds in inventory. Real production would have the
  # chain start with a navigate-to-stash-and-withdraw card (like the
  # two-bot demo does), but for the first 5b trial we shortcut so the
  # focus is on the multi-domain till/plant/deposit chain itself.
  # Once 5b passes, a follow-up can add the stash + withdraw cards
  # to mirror the two-bot architecture.
  - "give Mox minecraft:wooden_hoe 1"
  - "give Mox minecraft:wheat_seeds 64"

  - "local: sleep 2"

  # ── Marks ──────────────────────────────────────────────────────
  # POST nested {at: {x,y,z}} per the locations.js#resolvePlace contract
  # documented in mc-verify-spec.md. Single-quoted YAML so the
  # run-fixture.sh parser preserves interior `"` chars.
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/mark -H "content-type: application/json" -d "{\"name\":\"field_south\",\"at\":{\"x\":-50,\"y\":64,\"z\":50},\"note\":\"wheat farm plot center\"}" >/dev/null || echo "mark field_south: bot HTTP not reachable"'
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/mark -H "content-type: application/json" -d "{\"name\":\"chest_food\",\"at\":{\"x\":-50,\"y\":65,\"z\":60},\"note\":\"wheat storage chest\"}" >/dev/null || echo "mark chest_food: bot HTTP not reachable"'
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/mark -H "content-type: application/json" -d "{\"name\":\"base_anchor\",\"at\":{\"x\":-55,\"y\":65,\"z\":50},\"note\":\"Mox start position (west edge of plot)\"}" >/dev/null || echo "mark base_anchor: bot HTTP not reachable"'

cleanup:
  # Drop marks
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/unmark -H "content-type: application/json" -d "{\"name\":\"field_south\"}" >/dev/null || true'
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/unmark -H "content-type: application/json" -d "{\"name\":\"chest_food\"}" >/dev/null || true'
  - 'local: curl -sf -X POST http://127.0.0.1:3004/action/unmark -H "content-type: application/json" -d "{\"name\":\"base_anchor\"}" >/dev/null || true'

  # Clear the chest + water + soil stack + air above
  - "execute in landfolk-test run setblock -50 65 60 minecraft:air"
  - "execute in landfolk-test run setblock -50 64 50 minecraft:air"
  - "execute in landfolk-test run fill -55 64 45 -45 64 55 minecraft:air"
  - "execute in landfolk-test run fill -55 60 45 -45 63 55 minecraft:air"
  - "execute in landfolk-test run fill -55 59 45 -45 59 55 minecraft:air"
  - "execute in landfolk-test run fill -55 65 45 -45 75 55 minecraft:air"
  - "execute in landfolk-test run kill @e[type=item,distance=..16,x=-50,y=65,z=50]"
  - "execute in landfolk-test run forceload remove -60 40 -40 60"

  # Return Mox to a neutral position
  - "execute in landfolk-test run tp Mox 0 65 0"
  - "clear Mox"
