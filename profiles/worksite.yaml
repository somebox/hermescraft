# Worksite setting — build/repair/defense on a natural flat pad (Setting 3 base).
arena:
  center: [0, 0]
  radius: 48

gates:
  - biome in [plains, sunflower_plains, snowy_plains, forest, flower_forest, birch_forest, old_growth_birch_forest, dark_forest, taiga, snowy_taiga, old_growth_pine_taiga, old_growth_spruce_taiga, meadow, savanna, savanna_plateau, cherry_grove, desert, beach, snowy_beach, stony_shore] >= 50%
  - biomes distinct <= 7
  - flat patch >= 10 cells
  - neighbor height delta <= 8 blocks
  - surface water <= 25%
  # No grass requirement — building works on any solid surface.

placements:
  spawn: random_safe radius 1 attempts 32
  muster: offset_from spawn [6, 0, 0]

find: 3 solutions max 80 seeds
