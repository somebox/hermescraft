[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure logic, no MC server, no LLM, no network",
  "functional: live MC server required; no LLM",
  "integration: live MC server + LLM API key required",
  "slow: takes >30s, skip in fast feedback loops",
]
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
