[project]
name = "hermescraft-mapcatalog"
version = "0.1.0"
description = "Procedural map catalog seed finder (mapcatalog/)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
mapcatalog = "mapcatalog.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "unit: pure logic, no MC server, no LLM, no network",
  "functional: live MC server required; no LLM",
  "integration: live MC server + LLM API key required; uses _functional_harness reset/park/trace; not collected by functional-only runners",
  "slow: takes >30s, skip in fast feedback loops",
  "trace(interval): per-test BotTrace poll interval in seconds (default 1.0)",
  "no_trace: disable BotTrace poller for this test",
]
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
